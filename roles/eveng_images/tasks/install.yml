---
# purpose: Install EVE-NG images from cache into the addons tree
# maintainer: HybridOps.Tech

- name: Discover installable files when metadata is not provided
  ansible.builtin.find:
    paths: "{{ eveng_images_cache_dir }}"
    patterns:
      - "*.tar.gz"
      - "*.tgz"
      - "*.zip"
      - "*.gz"
      - "*.qcow2"
      - "*.img"
      - "*.bin"
    recurse: false
  register: eveng_images_install_files
  when: eveng_images_downloaded_files is not defined

- name: Use previously discovered download metadata when available
  ansible.builtin.set_fact:
    eveng_images_install_files:
      files: "{{ eveng_images_downloaded_files }}"
  when: eveng_images_downloaded_files is defined
  changed_when: false

- name: Fail when there is nothing to install
  ansible.builtin.fail:
    msg: "No archives or images found to install in {{ eveng_images_cache_dir }}"
  when: (eveng_images_install_files.files | default([]) | length) == 0

- name: Detect type for each file
  ansible.builtin.shell: |
    set -euo pipefail
    ARCHIVE="{{ item.path }}"
    BASENAME="$(basename "$ARCHIVE")"
    EXT="${BASENAME##*.}"
    MIME_TYPE="$(file --brief --mime-type "$ARCHIVE" 2>/dev/null || true)"

    case "$EXT" in
      qcow2|img)
        if ! command -v qemu-img >/dev/null 2>&1; then
          echo "invalid:qemu-img-unavailable"
          exit 0
        fi
        if ! qemu-img info --output=json "$ARCHIVE" >/dev/null 2>&1; then
          echo "invalid:qemu-disk"
          exit 0
        fi
        case "$MIME_TYPE" in
          text/*|application/json|application/xml)
            echo "invalid:qemu-content"
            exit 0
            ;;
        esac
        if [ "$EXT" = "qcow2" ] \
          && ! qemu-img info --output=json "$ARCHIVE" \
            | grep -Eq '"format"[[:space:]]*:[[:space:]]*"qcow2"'; then
          echo "invalid:qemu-format"
          exit 0
        fi
        echo "raw:qemu"
        exit 0
        ;;
      bin)
        case "$MIME_TYPE" in
          text/*|application/json|application/xml)
            echo "invalid:binary-content"
            exit 0
            ;;
        esac
        echo "raw:iol"
        exit 0
        ;;
    esac

    {% if eveng_images_list is defined %}
    # Metadata mapping for archives
    case "$BASENAME" in
    {% for img in eveng_images_list if img.name is defined %}
      "{{ img.name }}")
        echo "{{ img.type }}"
        exit 0
        ;;
    {% endfor %}
    esac
    {% endif %}

    if [[ "$BASENAME" == *.tar.gz || "$EXT" == "tgz" || "$EXT" == "zip" || "$EXT" == "gz" ]]; then
      if ! LIST_OUTPUT="$(tar -tzf "$ARCHIVE" 2>&1 | head -1)"; then
        echo "invalid"
        exit 0
      fi

      FIRST_DIR="$(printf '%s\n' "$LIST_OUTPUT" | cut -d'/' -f1)"

      if [[ "$FIRST_DIR" == "iol" || "$FIRST_DIR" == "qemu" || "$FIRST_DIR" == "dynamips" ]]; then
        echo "structured:$FIRST_DIR"
        exit 0
      fi

      echo "qemu"
      exit 0
    fi

    echo "qemu"
  args:
    executable: /bin/bash
  loop: "{{ eveng_images_install_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  register: eveng_images_detected_types
  changed_when: false

- name: Fail when an image archive is invalid
  ansible.builtin.assert:
    that:
      - not (item.stdout | trim).startswith('invalid')
    fail_msg: >-
      Invalid image file: {{ item.item.path }}
      ({{ item.stdout | trim }}).
  loop: "{{ eveng_images_detected_types.results | default([]) }}"
  loop_control:
    label: "{{ item.item.path | basename }}"

- name: Install each detected image
  ansible.builtin.include_tasks: install-one.yml
  loop: "{{ eveng_images_detected_types.results | default([]) }}"
  loop_control:
    loop_var: image_detection
    label: "{{ image_detection.item.path | basename }}"

- name: Repair EVE-NG image permissions
  ansible.builtin.command: "{{ eveng_images_fixpermissions_command }}"
  changed_when: true

- name: Install operator-supplied IOL licence material
  ansible.builtin.copy:
    dest: "{{ eveng_images_iol_license_path }}"
    content: "{{ eveng_images_iol_license_content | trim }}\n"
    owner: "{{ eveng_images_iol_license_owner }}"
    group: "{{ eveng_images_iol_license_group }}"
    mode: "0640"
  when: eveng_images_iol_license_content | string | length > 0
  no_log: true

- name: Verify IOL licence placement
  ansible.builtin.stat:
    path: "{{ eveng_images_iol_license_path }}"
  register: eveng_images_iol_license_stat
  when: eveng_images_iol_license_content | string | length > 0

- name: Require installed IOL licence material
  ansible.builtin.assert:
    that:
      - eveng_images_iol_license_stat.stat.isreg | default(false)
      - eveng_images_iol_license_stat.stat.mode == '0640'
      - eveng_images_iol_license_stat.stat.pw_name == eveng_images_iol_license_owner
      - eveng_images_iol_license_stat.stat.gr_name == eveng_images_iol_license_group
      - eveng_images_iol_license_stat.stat.size | default(0) > 0
    fail_msg: "The operator-supplied IOL licence file was not installed."
  when: eveng_images_iol_license_content | string | length > 0

- name: Publish IOL licence readiness without exposing material
  ansible.builtin.set_fact:
    eveng_images_iol_license_ready: >-
      {{ eveng_images_iol_license_stat.stat.isreg | default(false) }}
  when: eveng_images_iol_license_content | string | length > 0

- name: Verify every image produced installed content
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ eveng_images_installed_paths | default([]) }}"
  register: eveng_images_installed_path_stats

- name: Fail when installed image content is missing
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "Installed image content is missing: {{ item.item }}"
  loop: "{{ eveng_images_installed_path_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

- name: Fail when no image content was installed
  ansible.builtin.assert:
    that:
      - >-
        (eveng_images_installed_paths | default([]) | length)
        == (eveng_images_detected_types.results | default([]) | length)
    fail_msg: >-
      Installed {{ eveng_images_installed_paths | default([]) | length }} of
      {{ eveng_images_detected_types.results | default([]) | length }} requested image archives.
