---
# purpose: Verify a QEMU archive is placed in the EVE-NG addons layout
# maintainer: HybridOps.Tech

- name: Test EVE-NG image archive installation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    test_root: /tmp/hybridops-eveng-images-install-test
    eveng_images_cache_dir: "{{ test_root }}/cache"
    eveng_images_addons_dir: "{{ test_root }}/addons"
    eveng_images_install_manifest_path: "{{ test_root }}/install-manifest.json"
    eveng_images_install_manifest_owner: "{{ lookup('env', 'USER') }}"
    eveng_images_install_manifest_group: "{{ lookup('pipe', 'id -gn') }}"
    eveng_images_fixpermissions_command: "{{ test_root }}/fixpermissions"
    eveng_images_raw_qemu_layout: foldered
    eveng_images_raw_qemu_disk_name: virtioa.qcow2
    eveng_images_iol_license_content: |
      [license]
      test-host = 0000000000000000;
    # The role contract fixes these to root. The direct task fixture runs
    # unprivileged and overrides ownership only to exercise placement safely.
    eveng_images_iol_license_owner: "{{ lookup('env', 'USER') }}"
    eveng_images_iol_license_group: "{{ lookup('pipe', 'id -gn') }}"
    eveng_images_list: []

  tasks:
    - name: Reset test directory
      ansible.builtin.file:
        path: "{{ test_root }}"
        state: absent

    - name: Create fixture directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ eveng_images_cache_dir }}"
        - "{{ test_root }}/fixture/linux-test"
        - "{{ test_root }}/fixture/bigip"
        - "{{ eveng_images_addons_dir }}/iol/bin"

    - name: Create permission repair fixture
      ansible.builtin.copy:
        dest: "{{ eveng_images_fixpermissions_command }}"
        mode: "0755"
        content: |
          #!/bin/sh
          set -eu
          test -f "{{ eveng_images_addons_dir }}/iol/bin/iourc"
          chmod 0644 "{{ eveng_images_addons_dir }}/iol/bin/iourc"
          chmod 0755 "{{ eveng_images_addons_dir }}/iol/bin/"*.bin
          touch "{{ test_root }}/fixpermissions-ran"

    - name: Create fixture disk
      ansible.builtin.copy:
        dest: "{{ test_root }}/fixture/linux-test/virtioa.qcow2"
        content: fixture
        mode: "0644"

    - name: Build fixture archive
      ansible.builtin.command:
        argv:
          - tar
          - -cf
          - "{{ eveng_images_cache_dir }}/linux-test.tar.gz"
          - -C
          - "{{ test_root }}/fixture"
          - linux-test
      changed_when: true

    - name: Create fixture IOL binary
      ansible.builtin.copy:
        dest: "{{ test_root }}/fixture/i86bi-linux-test.bin"
        content: fixture
        mode: "0755"

    - name: Build root-layout IOL fixture archive
      ansible.builtin.command:
        argv:
          - tar
          - -czf
          - "{{ eveng_images_cache_dir }}/iol-test.tar.gz"
          - -C
          - "{{ test_root }}/fixture"
          - i86bi-linux-test.bin
      changed_when: true

    - name: Create F5 BIG-IP system disk fixture
      ansible.builtin.copy:
        dest: "{{ test_root }}/fixture/bigip/BIGIP-11.6.0.0.0.401.qcow2"
        content: system-disk
        mode: "0644"

    - name: Create F5 BIG-IP datastore fixture
      ansible.builtin.copy:
        dest: "{{ test_root }}/fixture/bigip/BIGIP-11.6.0.0.0.401.DATASTOR.ALL.qcow2"
        content: datastore-disk
        mode: "0644"

    - name: Build F5 BIG-IP ZIP fixture
      ansible.builtin.command:
        argv:
          - zip
          - -q
          - -j
          - "{{ eveng_images_cache_dir }}/BIGIP-11.6.0.0.0.401.ALL.qcow2.zip"
          - "{{ test_root }}/fixture/bigip/BIGIP-11.6.0.0.0.401.qcow2"
          - "{{ test_root }}/fixture/bigip/BIGIP-11.6.0.0.0.401.DATASTOR.ALL.qcow2"
      changed_when: true

    - name: Run archive installer
      ansible.builtin.include_role:
        name: hybridops.helper.eveng_images
        tasks_from: install

    - name: Check installed disk
      ansible.builtin.stat:
        path: "{{ eveng_images_addons_dir }}/qemu/linux-test/virtioa.qcow2"
      register: eveng_images_test_installed_disk

    - name: Check installed IOL licence
      ansible.builtin.stat:
        path: "{{ eveng_images_addons_dir }}/iol/bin/iourc"
      register: eveng_images_test_iol_license

    - name: Check installed IOL binary
      ansible.builtin.stat:
        path: "{{ eveng_images_addons_dir }}/iol/bin/i86bi-linux-test.bin"
      register: eveng_images_test_iol_binary

    - name: Check permission repair execution
      ansible.builtin.stat:
        path: "{{ test_root }}/fixpermissions-ran"
      register: eveng_images_test_fixpermissions

    - name: Check installed F5 BIG-IP system disk
      ansible.builtin.stat:
        path: "{{ eveng_images_addons_dir }}/qemu/bigip-11.6.0.0.0.401/virtioa.qcow2"
      register: eveng_images_test_bigip_system_disk

    - name: Check installed F5 BIG-IP datastore
      ansible.builtin.stat:
        path: "{{ eveng_images_addons_dir }}/qemu/bigip-11.6.0.0.0.401/virtiob.qcow2"
      register: eveng_images_test_bigip_datastore

    - name: Require installed disk
      ansible.builtin.assert:
        that:
          - eveng_images_test_installed_disk.stat.exists
          - eveng_images_test_iol_binary.stat.isreg
          - eveng_images_test_iol_binary.stat.executable
          - eveng_images_test_iol_license.stat.isreg
          - eveng_images_test_iol_license.stat.mode == '0644'
          - eveng_images_test_iol_license.stat.pw_name == eveng_images_iol_license_owner
          - eveng_images_test_iol_license.stat.gr_name == eveng_images_iol_license_group
          - eveng_images_test_iol_license.stat.size > 0
          - eveng_images_iol_license_ready | bool
          - eveng_images_test_fixpermissions.stat.exists
          - eveng_images_test_bigip_system_disk.stat.isreg
          - eveng_images_test_bigip_datastore.stat.isreg
          - eveng_images_install_ready | bool
          - eveng_images_requested_count | int == 3
          - eveng_images_installed_count | int == 3
          - eveng_images_installed_names | length == 3
          - "'linux-test.tar.gz' in eveng_images_installed_names"
          - "'iol-test.tar.gz' in eveng_images_installed_names"
          - >-
            'BIGIP-11.6.0.0.0.401.ALL.qcow2.zip'
            in eveng_images_installed_names

    - name: Change installed disk after first installation
      ansible.builtin.copy:
        dest: "{{ eveng_images_addons_dir }}/qemu/linux-test/virtioa.qcow2"
        content: operator-state
        mode: "0644"

    - name: Reset permission repair marker
      ansible.builtin.file:
        path: "{{ test_root }}/fixpermissions-ran"
        state: absent

    - name: Make installed source archives unreadable
      ansible.builtin.file:
        path: "{{ eveng_images_cache_dir }}/{{ item }}"
        mode: "0000"
      loop:
        - linux-test.tar.gz
        - iol-test.tar.gz
        - BIGIP-11.6.0.0.0.401.ALL.qcow2.zip

    - name: Repeat archive installer
      ansible.builtin.include_role:
        name: hybridops.helper.eveng_images
        tasks_from: install

    - name: Read unchanged installed disk
      ansible.builtin.slurp:
        path: "{{ eveng_images_addons_dir }}/qemu/linux-test/virtioa.qcow2"
      register: eveng_images_reused_disk

    - name: Check permission repair was skipped
      ansible.builtin.stat:
        path: "{{ test_root }}/fixpermissions-ran"
      register: eveng_images_reused_fixpermissions

    - name: Require unchanged image reuse
      ansible.builtin.assert:
        that:
          - eveng_images_reused_disk.content | b64decode == 'operator-state'
          - not eveng_images_reused_fixpermissions.stat.exists
          - eveng_images_pending_installations | length == 0
          - eveng_images_reusable_detection_inputs | length == 3
          - eveng_images_pending_detection_inputs | length == 0
          - eveng_images_requested_count | int == 3
          - eveng_images_installed_count | int == 3

    - name: Create additional image fixture directory
      ansible.builtin.file:
        path: "{{ test_root }}/fixture/linux-new"
        state: directory
        mode: "0755"

    - name: Create additional image fixture disk
      ansible.builtin.copy:
        dest: "{{ test_root }}/fixture/linux-new/virtioa.qcow2"
        content: new-fixture
        mode: "0644"

    - name: Build additional image fixture archive
      ansible.builtin.command:
        argv:
          - tar
          - -cf
          - "{{ eveng_images_cache_dir }}/linux-new.tar.gz"
          - -C
          - "{{ test_root }}/fixture"
          - linux-new
      changed_when: true

    - name: Install additional image
      ansible.builtin.include_role:
        name: hybridops.helper.eveng_images
        tasks_from: install

    - name: Read retained installed disk
      ansible.builtin.slurp:
        path: "{{ eveng_images_addons_dir }}/qemu/linux-test/virtioa.qcow2"
      register: eveng_images_retained_disk

    - name: Check additional installed image
      ansible.builtin.stat:
        path: "{{ eveng_images_addons_dir }}/qemu/linux-new/virtioa.qcow2"
      register: eveng_images_additional_disk

    - name: Require incremental image installation
      ansible.builtin.assert:
        that:
          - eveng_images_retained_disk.content | b64decode == 'operator-state'
          - eveng_images_additional_disk.stat.isreg
          - eveng_images_pending_installations | length == 1
          - eveng_images_requested_count | int == 4
          - eveng_images_installed_count | int == 4
          - eveng_images_installed_names | length == 4
          - "'linux-new.tar.gz' in eveng_images_installed_names"

    - name: Remove test directory
      ansible.builtin.file:
        path: "{{ test_root }}"
        state: absent
