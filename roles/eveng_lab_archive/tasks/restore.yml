---
- name: Validate expected archive checksum
  ansible.builtin.assert:
    that:
      - eveng_lab_archive_expected_sha256 is match('^[0-9a-fA-F]{64}$')
    fail_msg: "eveng_lab_archive_expected_sha256 must contain 64 hexadecimal characters"

- name: Inspect controller archive
  ansible.builtin.stat:
    path: "{{ _eveng_lab_archive_path }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: eveng_lab_archive_controller_stat

- name: Verify controller archive
  ansible.builtin.assert:
    that:
      - eveng_lab_archive_controller_stat.stat.isreg | default(false)
      - eveng_lab_archive_controller_stat.stat.checksum | lower == eveng_lab_archive_expected_sha256 | lower
    fail_msg: "EVE-NG lab archive is missing or its SHA-256 checksum does not match"

- name: List controller archive members
  ansible.builtin.command:
    argv:
      - tar
      - -tzf
      - "{{ _eveng_lab_archive_path }}"
  delegate_to: localhost
  become: false
  changed_when: false
  register: eveng_lab_archive_member_list

- name: Inspect controller archive member types
  ansible.builtin.command:
    argv:
      - tar
      - -tvzf
      - "{{ _eveng_lab_archive_path }}"
  delegate_to: localhost
  become: false
  changed_when: false
  register: eveng_lab_archive_member_types

- name: Reject unsafe archive members
  ansible.builtin.assert:
    that:
      - >-
        eveng_lab_archive_member_list.stdout_lines
        | reject('match', '(^/|(^|/)\.\.(/|$))')
        | list
        | length == eveng_lab_archive_member_list.stdout_lines | length
    fail_msg: "EVE-NG lab archive contains an unsafe path"

- name: Reject archive links
  ansible.builtin.assert:
    that:
      - >-
        eveng_lab_archive_member_types.stdout_lines
        | select('match', '^[lh]')
        | list
        | length == 0
    fail_msg: "EVE-NG lab archive must not contain symbolic or hard links"

- name: Ensure EVE-NG labs root exists
  ansible.builtin.file:
    path: "{{ eveng_lab_archive_labs_root }}"
    state: directory
    owner: "{{ eveng_lab_archive_owner }}"
    group: "{{ eveng_lab_archive_group }}"
    mode: "0775"

- name: Select archive payload files
  ansible.builtin.set_fact:
    eveng_lab_archive_payload_files: >-
      {{
        eveng_lab_archive_member_list.stdout_lines
        | map('regex_replace', '^\./', '')
        | reject('equalto', '')
        | reject('equalto', '.')
        | reject('equalto', '.updated')
        | reject('match', '.+/$')
        | list
      }}
  when: not eveng_lab_archive_overwrite | bool

- name: Inspect existing archive payload paths
  ansible.builtin.stat:
    path: "{{ eveng_lab_archive_labs_root }}/{{ item }}"
  loop: "{{ eveng_lab_archive_payload_files | default([]) }}"
  loop_control:
    label: "{{ item }}"
  register: eveng_lab_archive_existing_payload
  when: not eveng_lab_archive_overwrite | bool

- name: Protect existing archive payload files
  ansible.builtin.assert:
    that:
      - not item.stat.exists
    fail_msg: >-
      EVE-NG lab content already exists at {{ item.item }}. Set
      eveng_lab_archive_overwrite=true only when replacing it is intended.
  loop: "{{ eveng_lab_archive_existing_payload.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: not eveng_lab_archive_overwrite | bool

- name: Remove existing lab content for explicit replacement
  ansible.builtin.file:
    path: "{{ eveng_lab_archive_labs_root }}"
    state: absent
  when: eveng_lab_archive_overwrite | bool

- name: Recreate EVE-NG labs root for explicit replacement
  ansible.builtin.file:
    path: "{{ eveng_lab_archive_labs_root }}"
    state: directory
    owner: "{{ eveng_lab_archive_owner }}"
    group: "{{ eveng_lab_archive_group }}"
    mode: "0775"
  when: eveng_lab_archive_overwrite | bool

- name: Restore EVE-NG lab archive
  ansible.builtin.unarchive:
    src: "{{ _eveng_lab_archive_path }}"
    dest: "{{ eveng_lab_archive_labs_root }}"
    owner: "{{ eveng_lab_archive_owner }}"
    group: "{{ eveng_lab_archive_group }}"
    remote_src: false

- name: Normalise restored EVE-NG lab ownership
  ansible.builtin.file:
    path: "{{ eveng_lab_archive_labs_root }}"
    owner: "{{ eveng_lab_archive_owner }}"
    group: "{{ eveng_lab_archive_group }}"
    recurse: true

- name: Publish EVE-NG lab restore result
  ansible.builtin.set_fact:
    eveng_lab_archive_results:
      action: restore
      archive_path: "{{ _eveng_lab_archive_path }}"
      sha256: "{{ eveng_lab_archive_controller_stat.stat.checksum }}"
      folders: "{{ eveng_lab_archive_folders }}"
