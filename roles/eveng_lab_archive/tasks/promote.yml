---
- name: Inspect current EVE-NG archive generation
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
  loop:
    - "{{ _eveng_lab_archive_path }}"
    - "{{ _eveng_lab_archive_path }}.json"
    - "{{ _eveng_lab_archive_node_state_path }}"
  delegate_to: localhost
  become: false
  register: eveng_lab_archive_current_generation

- name: Require a complete current EVE-NG archive generation
  ansible.builtin.assert:
    that:
      - >-
        not eveng_lab_archive_current_generation.results[0].stat.exists
        or eveng_lab_archive_current_generation.results[1].stat.isreg | default(false)
    fail_msg: >-
      Current EVE-NG archive has no manifest. Move or repair it before export:
      {{ _eveng_lab_archive_path }}
  delegate_to: localhost
  become: false

- name: Read current EVE-NG archive manifest
  ansible.builtin.slurp:
    path: "{{ _eveng_lab_archive_path }}.json"
  delegate_to: localhost
  become: false
  register: eveng_lab_archive_current_manifest_raw
  when: eveng_lab_archive_current_generation.results[0].stat.exists

- name: Parse current EVE-NG archive manifest
  ansible.builtin.set_fact:
    eveng_lab_archive_current_manifest: >-
      {{ eveng_lab_archive_current_manifest_raw.content | b64decode | from_json }}
  when: eveng_lab_archive_current_generation.results[0].stat.exists

- name: Verify current EVE-NG archive before rotation
  ansible.builtin.assert:
    that:
      - >-
        eveng_lab_archive_current_manifest.sha256 | lower
        == eveng_lab_archive_current_generation.results[0].stat.checksum | lower
      - >-
        not (eveng_lab_archive_current_manifest.node_state.included | default(false))
        or eveng_lab_archive_current_generation.results[2].stat.isreg | default(false)
      - >-
        not (eveng_lab_archive_current_manifest.node_state.included | default(false))
        or (
          eveng_lab_archive_current_manifest.node_state.sha256 | lower
          == eveng_lab_archive_current_generation.results[2].stat.checksum | lower
        )
    fail_msg: >-
      Current EVE-NG archive generation failed verification. It was not replaced.
  delegate_to: localhost
  become: false
  when: eveng_lab_archive_current_generation.results[0].stat.exists

- name: Remove older EVE-NG fallback generation
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ _eveng_lab_archive_previous_path }}"
    - "{{ _eveng_lab_archive_previous_path }}.json"
    - "{{ _eveng_lab_archive_node_state_previous_path }}"
  delegate_to: localhost
  become: false

- name: Retain current EVE-NG archive as fallback
  ansible.builtin.file:
    src: "{{ item.src }}"
    path: "{{ item.dest }}"
    state: hard
    mode: "0600"
  loop:
    - src: "{{ _eveng_lab_archive_path }}"
      dest: "{{ _eveng_lab_archive_previous_path }}"
    - src: "{{ _eveng_lab_archive_path }}.json"
      dest: "{{ _eveng_lab_archive_previous_path }}.json"
    - src: "{{ _eveng_lab_archive_node_state_path }}"
      dest: "{{ _eveng_lab_archive_node_state_previous_path }}"
  loop_control:
    label: "{{ item.src }}"
  delegate_to: localhost
  become: false
  when:
    - eveng_lab_archive_current_generation.results[0].stat.exists
    - >-
      item.src != _eveng_lab_archive_node_state_path
      or eveng_lab_archive_current_generation.results[2].stat.exists

- name: Promote verified EVE-NG lab archive
  ansible.builtin.command:
    argv:
      - mv
      - "{{ _eveng_lab_archive_candidate_path }}"
      - "{{ _eveng_lab_archive_path }}"
  delegate_to: localhost
  become: false
  changed_when: true

- name: Promote verified EVE-NG node-state archive
  ansible.builtin.command:
    argv:
      - mv
      - "{{ _eveng_lab_archive_node_state_candidate_path }}"
      - "{{ _eveng_lab_archive_node_state_path }}"
  delegate_to: localhost
  become: false
  changed_when: true
  when: eveng_lab_archive_results.node_state_included | default(false)

- name: Remove obsolete current EVE-NG node-state archive
  ansible.builtin.file:
    path: "{{ _eveng_lab_archive_node_state_path }}"
    state: absent
  delegate_to: localhost
  become: false
  when: not (eveng_lab_archive_results.node_state_included | default(false))

- name: Promote verified EVE-NG archive manifest
  ansible.builtin.command:
    argv:
      - mv
      - "{{ _eveng_lab_archive_candidate_path }}.json"
      - "{{ _eveng_lab_archive_path }}.json"
  delegate_to: localhost
  become: false
  changed_when: true

- name: Publish EVE-NG fallback archive path
  ansible.builtin.set_fact:
    eveng_lab_archive_results: >-
      {{
        eveng_lab_archive_results
        | combine({
          'previous_archive_path': (
            _eveng_lab_archive_previous_path
            if eveng_lab_archive_current_generation.results[0].stat.exists
            else ''
          ),
          'previous_manifest_path': (
            _eveng_lab_archive_previous_path ~ '.json'
            if eveng_lab_archive_current_generation.results[0].stat.exists
            else ''
          ),
          'previous_node_state_archive_path': (
            _eveng_lab_archive_node_state_previous_path
            if (
              eveng_lab_archive_current_generation.results[0].stat.exists
              and eveng_lab_archive_current_manifest.node_state.included
              | default(false)
            )
            else ''
          )
        })
      }}
