---
- name: Test EVE-NG lab archive export and restore
  hosts: localhost
  become: false
  gather_facts: false
  vars:
    test_root: /tmp/hyops-eveng-lab-archive-test
    test_node_state_root: /tmp/hyops-eveng-lab-node-state-test
    test_archive: /tmp/hyops-eveng-lab-archive-test-output/labs.tar.gz
    test_image_source: /tmp/hyops-eveng-image-source
    test_image_root: /tmp/hyops-eveng-image-target
    test_image_archive: /tmp/hyops-eveng-image-archive/images.tar.gz
    test_api_port: 18765
    eveng_lab_archive_tenant_uid_base: "{{ lookup('pipe', 'id -u') | int }}"
    eveng_lab_archive_tenant_gid: "{{ lookup('pipe', 'id -g') }}"
  tasks:
    - name: Clear previous test data
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ test_root }}"
        - "{{ test_node_state_root }}"
        - "{{ test_archive | dirname }}"
        - "{{ test_image_source }}"
        - "{{ test_image_root }}"
        - "{{ test_image_archive | dirname }}"

    - name: Prepare test lab
      block:
        - name: Create test lab directory
          ansible.builtin.file:
            path: "{{ test_root }}/student"
            state: directory
            mode: "0775"
        - name: Write test lab definition
          ansible.builtin.copy:
            dest: "{{ test_root }}/student/routing lab.unl"
            mode: "0664"
            content: >-
              <lab name="routing"><topology><nodes><node id="1" name="R1"
              config="0"/></nodes></topology></lab>
        - name: Start mock EVE-NG API
          ansible.builtin.shell: >-
            python3 {{ (playbook_dir ~ '/mock_eve_api.py') | quote }}
            --labs-root {{ test_root | quote }}
            --port {{ test_api_port | quote }}
            >/tmp/hyops-eveng-mock-api.log 2>&1 & echo $!
          args:
            executable: /bin/bash
          changed_when: true
          register: eveng_lab_archive_mock_api
        - name: Wait for mock EVE-NG API
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: "{{ test_api_port }}"
            timeout: 10
        - name: Create test node-state directory
          ansible.builtin.file:
            path: "{{ test_node_state_root }}/0/test-lab/1"
            state: directory
            mode: "0755"
        - name: Create test QEMU overlay
          ansible.builtin.command:
            argv:
              - qemu-img
              - create
              - -f
              - qcow2
              - "{{ test_node_state_root }}/0/test-lab/1/virtioa.qcow2"
              - 1M
          changed_when: true

        - name: Write test data to QEMU overlay
          ansible.builtin.command:
            argv:
              - qemu-io
              - -f
              - qcow2
              - -c
              - write -P 0x5a 0 512
              - "{{ test_node_state_root }}/0/test-lab/1/virtioa.qcow2"
          changed_when: true

        - name: Create test secondary QEMU overlay
          ansible.builtin.command:
            argv:
              - qemu-img
              - create
              - -f
              - qcow2
              - "{{ test_node_state_root }}/0/test-lab/1/virtiob.qcow2"
              - 1M
          changed_when: true

        - name: Create nested managed image directory
          ansible.builtin.file:
            path: >-
              {{ test_node_state_root }}/0/test-lab/1/opt/unetlab/addons/qemu/test-image
            state: directory
            mode: "0755"

        - name: Create nested managed base image
          ansible.builtin.command:
            argv:
              - qemu-img
              - create
              - -f
              - qcow2
              - >-
                {{ test_node_state_root }}/0/test-lab/1/opt/unetlab/addons/qemu/test-image/hda.qcow2
              - 1M
          changed_when: true

    - name: Export test lab
      ansible.builtin.include_role:
        name: hybridops.helper.eveng_lab_archive
      vars:
        eveng_lab_archive_action: export
        eveng_lab_archive_labs_root: "{{ test_root }}"
        eveng_lab_archive_folders: []
        eveng_lab_archive_path: "{{ test_archive }}"
        eveng_lab_archive_remote_dir: "{{ test_root }}-staging"
        eveng_lab_archive_owner: "{{ lookup('env', 'USER') }}"
        eveng_lab_archive_group: "{{ lookup('pipe', 'id -gn') }}"
        eveng_lab_archive_include_node_state: true
        eveng_lab_archive_node_state_root: "{{ test_node_state_root }}"
        eveng_lab_archive_qemu_img: /usr/bin/qemu-img
        eveng_lab_archive_capture_device_configs: true
        eveng_lab_archive_api_base_url: "http://127.0.0.1:{{ test_api_port }}"
        eveng_lab_archive_api_password_env: USER

    - name: Retain export checksum
      ansible.builtin.set_fact:
        eveng_lab_archive_test_checksum: "{{ eveng_lab_archive_results.sha256 }}"
        eveng_lab_archive_test_node_state_checksum: >-
          {{ eveng_lab_archive_results.node_state_sha256 }}

    - name: Require writable overlay selection
      ansible.builtin.assert:
        that:
          - eveng_lab_archive_results.node_state_files == 2
          - eveng_lab_archive_results.device_configs_captured
          - eveng_lab_archive_results.device_config_labs == ['student/routing lab.unl']

    - name: Change test lab before the next export
      ansible.builtin.copy:
        dest: "{{ test_root }}/student/routing.unl"
        mode: "0664"
        content: "<lab name=\"routing-updated\"/>\n"

    - name: Repeat test lab export
      ansible.builtin.include_role:
        name: hybridops.helper.eveng_lab_archive
      vars:
        eveng_lab_archive_action: export
        eveng_lab_archive_labs_root: "{{ test_root }}"
        eveng_lab_archive_folders: []
        eveng_lab_archive_path: "{{ test_archive }}"
        eveng_lab_archive_remote_dir: "{{ test_root }}-staging"
        eveng_lab_archive_owner: "{{ lookup('env', 'USER') }}"
        eveng_lab_archive_group: "{{ lookup('pipe', 'id -gn') }}"
        eveng_lab_archive_include_node_state: true
        eveng_lab_archive_node_state_root: "{{ test_node_state_root }}"
        eveng_lab_archive_qemu_img: /usr/bin/qemu-img
        eveng_lab_archive_capture_device_configs: true
        eveng_lab_archive_api_base_url: "http://127.0.0.1:{{ test_api_port }}"
        eveng_lab_archive_api_password_env: USER

    - name: Require a distinct current archive generation
      ansible.builtin.assert:
        that:
          - eveng_lab_archive_results.sha256 != eveng_lab_archive_test_checksum
          - >-
            eveng_lab_archive_results.node_state_sha256
            == eveng_lab_archive_test_node_state_checksum

    - name: Retain current export checksum
      ansible.builtin.set_fact:
        eveng_lab_archive_current_test_checksum: "{{ eveng_lab_archive_results.sha256 }}"

    - name: Inspect retained EVE-NG fallback generation
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - "{{ test_archive }}.previous"
        - "{{ test_archive }}.previous.json"
        - "{{ test_archive }}.node-state.tar.gz.previous"
      register: eveng_lab_archive_previous_generation

    - name: Require verified EVE-NG fallback generation
      ansible.builtin.assert:
        that:
          - eveng_lab_archive_previous_generation.results[0].stat.isreg
          - eveng_lab_archive_previous_generation.results[1].stat.isreg
          - eveng_lab_archive_previous_generation.results[2].stat.isreg
          - >-
            eveng_lab_archive_previous_generation.results[0].stat.checksum
            == eveng_lab_archive_test_checksum
          - >-
            eveng_lab_archive_previous_generation.results[2].stat.checksum
            == eveng_lab_archive_test_node_state_checksum

    - name: Reject a failed saved-configuration capture
      block:
        - name: Attempt export through an unavailable API path
          ansible.builtin.include_role:
            name: hybridops.helper.eveng_lab_archive
          vars:
            eveng_lab_archive_action: export
            eveng_lab_archive_labs_root: "{{ test_root }}"
            eveng_lab_archive_path: "{{ test_archive }}"
            eveng_lab_archive_remote_dir: "{{ test_root }}-staging"
            eveng_lab_archive_owner: "{{ lookup('env', 'USER') }}"
            eveng_lab_archive_group: "{{ lookup('pipe', 'id -gn') }}"
            eveng_lab_archive_capture_device_configs: true
            eveng_lab_archive_api_base_url: >-
              http://127.0.0.1:{{ test_api_port }}/unavailable
            eveng_lab_archive_api_password_env: USER
        - name: Reject successful export after failed capture
          ansible.builtin.fail:
            msg: "saved-configuration capture failure was accepted"
      rescue:
        - name: Record expected saved-configuration capture failure
          ansible.builtin.set_fact:
            eveng_lab_archive_capture_failure_observed: true

    - name: Check retained archive after failed capture
      ansible.builtin.stat:
        path: "{{ test_archive }}"
        checksum_algorithm: sha256
      register: eveng_lab_archive_retained_archive

    - name: Require fail-closed capture behavior
      ansible.builtin.assert:
        that:
          - eveng_lab_archive_capture_failure_observed | default(false)
          - >-
            eveng_lab_archive_retained_archive.stat.checksum
            == eveng_lab_archive_current_test_checksum

    - name: Reject EVE-NG restore without sufficient disk space
      block:
        - name: Attempt EVE-NG restore above available capacity
          ansible.builtin.include_role:
            name: hybridops.helper.eveng_lab_archive
          vars:
            eveng_lab_archive_action: restore
            eveng_lab_archive_labs_root: "{{ test_root }}"
            eveng_lab_archive_path: "{{ test_archive }}"
            eveng_lab_archive_expected_sha256: >-
              {{ eveng_lab_archive_current_test_checksum }}
            eveng_lab_archive_overwrite: true
            eveng_lab_archive_owner: "{{ lookup('env', 'USER') }}"
            eveng_lab_archive_group: "{{ lookup('pipe', 'id -gn') }}"
            eveng_lab_archive_restore_free_reserve_bytes: 9000000000000000000
            eveng_lab_archive_activate_saved_configs: false
      rescue:
        - name: Record expected EVE-NG capacity failure
          ansible.builtin.set_fact:
            eveng_lab_archive_capacity_failure_observed: true
            eveng_lab_archive_capacity_failure_message: >-
              {{ ansible_failed_result.msg | default('') }}

    - name: Inspect EVE-NG lab after capacity rejection
      ansible.builtin.stat:
        path: "{{ test_root }}/student/routing lab.unl"
      register: eveng_lab_archive_after_capacity_failure

    - name: Require fail-closed EVE-NG capacity check
      ansible.builtin.assert:
        that:
          - eveng_lab_archive_capacity_failure_observed | default(false)
          - >-
            'Insufficient disk space to restore EVE-NG labs'
            in eveng_lab_archive_capacity_failure_message
          - eveng_lab_archive_after_capacity_failure.stat.isreg | default(false)

    - name: Remove test lab before restore
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ test_root }}"
        - "{{ test_node_state_root }}"

    - name: Prepare referenced EVE-NG image fixture
      ansible.builtin.file:
        path: "{{ test_image_source }}/qemu/test-image"
        state: directory
        mode: "0755"

    - name: Write referenced EVE-NG image fixture
      ansible.builtin.copy:
        dest: "{{ test_image_source }}/qemu/test-image/virtioa.qcow2"
        content: "portable base image\n"
        mode: "0644"

    - name: Create controller EVE-NG image archive directory
      ansible.builtin.file:
        path: "{{ test_image_archive | dirname }}"
        state: directory
        mode: "0700"

    - name: Create referenced EVE-NG image archive
      ansible.builtin.command:
        argv:
          - tar
          - -cJf
          - "{{ test_image_archive }}"
          - -C
          - "{{ test_image_source }}"
          - qemu
      changed_when: true

    - name: Inspect referenced EVE-NG image archive
      ansible.builtin.stat:
        path: "{{ test_image_archive }}"
        checksum_algorithm: sha256
      register: eveng_lab_archive_test_image_stat

    - name: Verify fail-closed EVE-NG image capacity check
      block:
        - name: Attempt image restore without sufficient capacity
          ansible.builtin.include_role:
            name: hybridops.helper.eveng_lab_archive
          vars:
            eveng_lab_archive_action: restore
            eveng_lab_archive_labs_root: "{{ test_root }}"
            eveng_lab_archive_path: "{{ test_archive }}"
            eveng_lab_archive_expected_sha256: >-
              {{ eveng_lab_archive_current_test_checksum }}
            eveng_lab_archive_owner: "{{ lookup('env', 'USER') }}"
            eveng_lab_archive_group: "{{ lookup('pipe', 'id -gn') }}"
            eveng_lab_archive_restore_images: true
            eveng_lab_archive_images_root: "{{ test_image_root }}"
            eveng_lab_archive_images_owner: "{{ lookup('env', 'USER') }}"
            eveng_lab_archive_images_group: "{{ lookup('pipe', 'id -gn') }}"
            eveng_lab_archive_images_path: "{{ test_image_archive }}"
            eveng_lab_archive_images_expected_sha256: >-
              {{ eveng_lab_archive_test_image_stat.stat.checksum }}
            eveng_lab_archive_restore_free_reserve_bytes: 9223372036854775807
            eveng_lab_archive_fixpermissions_command: /bin/true
            eveng_lab_archive_api_base_url: "http://127.0.0.1:{{ test_api_port }}"
            eveng_lab_archive_api_password_env: USER
        - name: Reject unexpected EVE-NG image capacity success
          ansible.builtin.fail:
            msg: "EVE-NG image restore unexpectedly passed its capacity gate"
      rescue:
        - name: Record expected EVE-NG image capacity failure
          ansible.builtin.set_fact:
            eveng_lab_archive_image_capacity_failure_observed: true
            eveng_lab_archive_image_capacity_failure_message: >-
              {{ ansible_failed_result.msg | default('') }}

    - name: Inspect image target after capacity failure
      ansible.builtin.stat:
        path: "{{ test_image_root }}/qemu/test-image/virtioa.qcow2"
      register: eveng_lab_archive_after_image_capacity_failure

    - name: Require fail-closed EVE-NG image capacity check
      ansible.builtin.assert:
        that:
          - eveng_lab_archive_image_capacity_failure_observed | default(false)
          - >-
            'Insufficient disk space to restore EVE-NG images'
            in eveng_lab_archive_image_capacity_failure_message
          - not eveng_lab_archive_after_image_capacity_failure.stat.exists

    - name: Recreate test lab root
      ansible.builtin.file:
        path: "{{ test_root }}"
        state: directory
        mode: "0755"

    - name: Create EVE-NG lab root marker
      ansible.builtin.copy:
        dest: "{{ test_root }}/.updated"
        content: ""
        mode: "0644"

    - name: Restore test lab
      ansible.builtin.include_role:
        name: hybridops.helper.eveng_lab_archive
      vars:
        eveng_lab_archive_action: restore
        eveng_lab_archive_labs_root: "{{ test_root }}"
        eveng_lab_archive_folders: [student]
        eveng_lab_archive_path: "{{ test_archive }}"
        eveng_lab_archive_expected_sha256: >-
          {{ eveng_lab_archive_current_test_checksum }}
        eveng_lab_archive_owner: "{{ lookup('env', 'USER') }}"
        eveng_lab_archive_group: "{{ lookup('pipe', 'id -gn') }}"
        eveng_lab_archive_restore_node_state: true
        eveng_lab_archive_restore_images: true
        eveng_lab_archive_images_root: "{{ test_image_root }}"
        eveng_lab_archive_images_owner: "{{ lookup('env', 'USER') }}"
        eveng_lab_archive_images_group: "{{ lookup('pipe', 'id -gn') }}"
        eveng_lab_archive_images_path: "{{ test_image_archive }}"
        eveng_lab_archive_images_expected_sha256: >-
          {{ eveng_lab_archive_test_image_stat.stat.checksum }}
        eveng_lab_archive_fixpermissions_command: /bin/true
        eveng_lab_archive_node_state_root: "{{ test_node_state_root }}"
        eveng_lab_archive_node_state_expected_sha256: >-
          {{ eveng_lab_archive_test_node_state_checksum }}
        eveng_lab_archive_qemu_img: /usr/bin/qemu-img
        eveng_lab_archive_api_base_url: "http://127.0.0.1:{{ test_api_port }}"
        eveng_lab_archive_api_password_env: USER

    - name: Verify restored test lab
      ansible.builtin.stat:
        path: "{{ test_root }}/student/routing lab.unl"
      register: eveng_lab_archive_restored_lab

    - name: Verify restored referenced EVE-NG image
      ansible.builtin.stat:
        path: "{{ test_image_root }}/qemu/test-image/virtioa.qcow2"
      register: eveng_lab_archive_restored_image

    - name: Read restored test lab
      ansible.builtin.slurp:
        path: "{{ test_root }}/student/routing lab.unl"
      register: eveng_lab_archive_restored_lab_content

    - name: Require restored test lab
      ansible.builtin.assert:
        that:
          - eveng_lab_archive_restored_lab.stat.isreg
          - eveng_lab_archive_restored_image.stat.isreg
          - eveng_lab_archive_results.images_included
          - eveng_lab_archive_results.images_restored
          - >-
            'config="1"' in
            (eveng_lab_archive_restored_lab_content.content | b64decode)
          - >-
            '<config id="1">' in
            (eveng_lab_archive_restored_lab_content.content | b64decode)

    - name: Write existing EVE-NG image content for rollback test
      ansible.builtin.copy:
        dest: "{{ test_image_root }}/qemu/test-image/virtioa.qcow2"
        content: existing-base
        mode: "0644"

    - name: Verify transactional EVE-NG image rollback
      block:
        - name: Attempt image replacement with a failing permission step
          ansible.builtin.include_role:
            name: hybridops.helper.eveng_lab_archive
          vars:
            eveng_lab_archive_action: restore
            eveng_lab_archive_labs_root: "{{ test_root }}"
            eveng_lab_archive_folders: [student]
            eveng_lab_archive_path: "{{ test_archive }}"
            eveng_lab_archive_expected_sha256: >-
              {{ eveng_lab_archive_current_test_checksum }}
            eveng_lab_archive_owner: "{{ lookup('env', 'USER') }}"
            eveng_lab_archive_group: "{{ lookup('pipe', 'id -gn') }}"
            eveng_lab_archive_restore_images: true
            eveng_lab_archive_overwrite_images: true
            eveng_lab_archive_images_root: "{{ test_image_root }}"
            eveng_lab_archive_images_owner: "{{ lookup('env', 'USER') }}"
            eveng_lab_archive_images_group: "{{ lookup('pipe', 'id -gn') }}"
            eveng_lab_archive_images_path: "{{ test_image_archive }}"
            eveng_lab_archive_images_expected_sha256: >-
              {{ eveng_lab_archive_test_image_stat.stat.checksum }}
            eveng_lab_archive_fixpermissions_command: /bin/false
            eveng_lab_archive_api_base_url: "http://127.0.0.1:{{ test_api_port }}"
            eveng_lab_archive_api_password_env: USER
        - name: Reject unexpected image replacement success
          ansible.builtin.fail:
            msg: "EVE-NG image replacement unexpectedly succeeded"
      rescue:
        - name: Record expected EVE-NG image replacement failure
          ansible.builtin.set_fact:
            eveng_lab_archive_image_rollback_observed: true

    - name: Read EVE-NG image after rollback
      ansible.builtin.slurp:
        path: "{{ test_image_root }}/qemu/test-image/virtioa.qcow2"
      register: eveng_lab_archive_image_after_rollback

    - name: Require transactional EVE-NG image rollback
      ansible.builtin.assert:
        that:
          - eveng_lab_archive_image_rollback_observed | default(false)
          - >-
            eveng_lab_archive_image_after_rollback.content | b64decode
            == 'existing-base'

    - name: Verify stale runtime state was cleared before node-state restore
      ansible.builtin.stat:
        path: "{{ test_root }}/student/routing lab.unl.wipe-observed"
      register: eveng_lab_archive_node_state_restore_wipe

    - name: Require mixed-state restore preparation
      ansible.builtin.assert:
        that:
          - eveng_lab_archive_node_state_restore_wipe.stat.isreg

    - name: Inspect restored tenant runtime ownership
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ test_node_state_root }}/0"
        - "{{ test_node_state_root }}/0/test-lab"
      register: eveng_lab_archive_restored_runtime_paths

    - name: Require writable restored tenant runtime
      ansible.builtin.assert:
        that:
          - >-
            eveng_lab_archive_restored_runtime_paths.results[0].stat.uid
            == lookup('pipe', 'id -u') | int
          - >-
            eveng_lab_archive_restored_runtime_paths.results[0].stat.gid
            == lookup('pipe', 'id -g') | int
          - eveng_lab_archive_restored_runtime_paths.results[0].stat.mode == '2775'
          - >-
            eveng_lab_archive_restored_runtime_paths.results[1].stat.uid
            == lookup('pipe', 'id -u') | int
          - >-
            eveng_lab_archive_restored_runtime_paths.results[1].stat.gid
            == lookup('pipe', 'id -g') | int

    - name: Verify restored test node state
      ansible.builtin.command:
        argv:
          - qemu-io
          - -f
          - qcow2
          - -c
          - read -P 0x5a 0 512
          - "{{ test_node_state_root }}/0/test-lab/1/virtioa.qcow2"
      changed_when: false

    - name: Verify restored secondary node state
      ansible.builtin.command:
        argv:
          - qemu-img
          - check
          - -q
          - "{{ test_node_state_root }}/0/test-lab/1/virtiob.qcow2"
      changed_when: false

    - name: Require retained node-state generation metadata
      ansible.builtin.assert:
        that:
          - eveng_lab_archive_results.node_state_included
          - eveng_lab_archive_results.node_state_restored
          - eveng_lab_archive_results.node_state_files == 2

    - name: Replace restored QEMU test data
      ansible.builtin.command:
        argv:
          - qemu-io
          - -f
          - qcow2
          - -c
          - write -P 0x00 0 512
          - "{{ test_node_state_root }}/0/test-lab/1/virtioa.qcow2"
      changed_when: true

    - name: Repeat node-state restore with overwrite
      ansible.builtin.include_role:
        name: hybridops.helper.eveng_lab_archive
      vars:
        eveng_lab_archive_action: restore
        eveng_lab_archive_labs_root: "{{ test_root }}"
        eveng_lab_archive_folders: [student]
        eveng_lab_archive_path: "{{ test_archive }}"
        eveng_lab_archive_expected_sha256: >-
          {{ eveng_lab_archive_current_test_checksum }}
        eveng_lab_archive_overwrite: true
        eveng_lab_archive_owner: "{{ lookup('env', 'USER') }}"
        eveng_lab_archive_group: "{{ lookup('pipe', 'id -gn') }}"
        eveng_lab_archive_restore_node_state: true
        eveng_lab_archive_node_state_root: "{{ test_node_state_root }}"
        eveng_lab_archive_node_state_expected_sha256: >-
          {{ eveng_lab_archive_test_node_state_checksum }}
        eveng_lab_archive_qemu_img: /usr/bin/qemu-img
        eveng_lab_archive_api_base_url: "http://127.0.0.1:{{ test_api_port }}"
        eveng_lab_archive_api_password_env: USER

    - name: Verify repeated QEMU node-state restore
      ansible.builtin.command:
        argv:
          - qemu-io
          - -f
          - qcow2
          - -c
          - read -P 0x5a 0 512
          - "{{ test_node_state_root }}/0/test-lab/1/virtioa.qcow2"
      changed_when: false

    - name: Read repeatedly restored test lab
      ansible.builtin.slurp:
        path: "{{ test_root }}/student/routing lab.unl"
      register: eveng_lab_archive_repeated_lab_content

    - name: Inspect repeated mixed-state restore preparation
      ansible.builtin.stat:
        path: "{{ test_root }}/student/routing lab.unl.wipe-observed"
      register: eveng_lab_archive_repeated_restore_wipe

    - name: Require repeated mixed-state restore
      ansible.builtin.assert:
        that:
          - >-
            'config="1"' in
            (eveng_lab_archive_repeated_lab_content.content | b64decode)
          - >-
            '<config id="1">' in
            (eveng_lab_archive_repeated_lab_content.content | b64decode)
          - eveng_lab_archive_repeated_restore_wipe.stat.isreg
          - eveng_lab_archive_results.node_state_included
          - eveng_lab_archive_results.node_state_restored

    - name: Remove restored lab before configuration-only restore
      ansible.builtin.file:
        path: "{{ test_root }}"
        state: absent

    - name: Restore test lab without node state
      ansible.builtin.include_role:
        name: hybridops.helper.eveng_lab_archive
      vars:
        eveng_lab_archive_action: restore
        eveng_lab_archive_labs_root: "{{ test_root }}"
        eveng_lab_archive_folders: [student]
        eveng_lab_archive_path: "{{ test_archive }}"
        eveng_lab_archive_expected_sha256: >-
          {{ eveng_lab_archive_current_test_checksum }}
        eveng_lab_archive_owner: "{{ lookup('env', 'USER') }}"
        eveng_lab_archive_group: "{{ lookup('pipe', 'id -gn') }}"
        eveng_lab_archive_restore_node_state: false
        eveng_lab_archive_api_base_url: "http://127.0.0.1:{{ test_api_port }}"
        eveng_lab_archive_api_password_env: USER

    - name: Verify stale runtime state was wiped
      ansible.builtin.stat:
        path: "{{ test_root }}/student/routing lab.unl.wipe-observed"
      register: eveng_lab_archive_restore_wipe

    - name: Require saved-configuration boot preparation
      ansible.builtin.assert:
        that:
          - eveng_lab_archive_restore_wipe.stat.isreg

  post_tasks:
    - name: Stop mock EVE-NG API
      ansible.builtin.command:
        argv:
          - kill
          - "{{ eveng_lab_archive_mock_api.stdout }}"
      changed_when: true
      failed_when: false
      when: eveng_lab_archive_mock_api.stdout | default('') | length > 0

    - name: Remove test data
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ test_root }}"
        - "{{ test_node_state_root }}"
        - "{{ test_archive | dirname }}"
        - "{{ test_image_source }}"
        - "{{ test_image_root }}"
        - "{{ test_image_archive | dirname }}"
