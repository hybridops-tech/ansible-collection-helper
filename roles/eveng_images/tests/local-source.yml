---
# purpose: Verify local image selection ignores stale target cache entries
# maintainer: HybridOps.Tech

- name: Test EVE-NG local image source
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    test_root: /tmp/hybridops-eveng-images-local-source-test
    eveng_images_local_path: "{{ test_root }}/source"
    eveng_images_cache_dir: "{{ test_root }}/cache"
    eveng_images_generate_report: false

  tasks:
    - name: Reset test directory
      ansible.builtin.file:
        path: "{{ test_root }}"
        state: absent

    - name: Create test directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ eveng_images_local_path }}"
        - "{{ eveng_images_cache_dir }}"

    - name: Create requested local images
      ansible.builtin.copy:
        dest: "{{ eveng_images_local_path }}/{{ item }}"
        content: "fixture\n"
        mode: "0644"
      loop:
        - requested-qemu.tar.gz
        - iol-requested.bin

    - name: Create stale cached image
      ansible.builtin.copy:
        dest: "{{ eveng_images_cache_dir }}/stale-image.tar.gz"
        content: "stale\n"
        mode: "0644"

    - name: Load local images
      ansible.builtin.include_role:
        name: hybridops.helper.eveng_images
        tasks_from: download-local

    - name: Resolve selected image names
      ansible.builtin.set_fact:
        selected_image_names: >-
          {{
            eveng_images_downloaded_files
            | map(attribute='path')
            | map('basename')
            | sort
            | list
          }}

    - name: Require only requested local images
      ansible.builtin.assert:
        that:
          - selected_image_names == ['iol-requested.bin', 'requested-qemu.tar.gz']

    - name: Remove test directory
      ansible.builtin.file:
        path: "{{ test_root }}"
        state: absent
