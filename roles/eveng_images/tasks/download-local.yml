---
# purpose: Copy EVE-NG image files from local filesystem into the cache
# maintainer: HybridOps.Tech

- name: Validate local path
  ansible.builtin.assert:
    that:
      - eveng_images_local_path is defined
      - (eveng_images_local_path | string | trim) != ""
    fail_msg: "eveng_images_local_path must be defined"
  changed_when: false

- name: Check if local path exists
  ansible.builtin.stat:
    path: "{{ eveng_images_local_path }}"
  delegate_to: localhost
  become: false
  register: eveng_images_local_path_stat
  changed_when: false

- name: Fail if path not found
  ansible.builtin.fail:
    msg: "Local path not found: {{ eveng_images_local_path }}"
  when: not (eveng_images_local_path_stat.stat.exists | default(false) | bool)

- name: Find images in local directory
  ansible.builtin.find:
    paths: "{{ eveng_images_local_path }}"
    patterns:
      - "*.tar.gz"
      - "*.tgz"
      - "*.zip"
      - "*.gz"
      - "*.qcow2"
      - "*.img"
      - "*.bin"
    recurse: true
    file_type: file
  delegate_to: localhost
  become: false
  register: eveng_images_local_files
  changed_when: false
  when: eveng_images_local_path_stat.stat.isdir | default(false) | bool

- name: Initialise requested local images
  ansible.builtin.set_fact:
    eveng_images_local_requested_files: []
  changed_when: false

- name: Record requested local image file
  ansible.builtin.set_fact:
    eveng_images_local_requested_files: >-
      {{
        eveng_images_local_requested_files
        + [{'relative_path': eveng_images_local_path | basename}]
      }}
  when: eveng_images_local_path_stat.stat.isreg | default(false) | bool
  changed_when: false

- name: Record requested local image directory entries
  ansible.builtin.set_fact:
    eveng_images_local_requested_files: >-
      {{
        eveng_images_local_requested_files
        + [
          {
            'relative_path': item.path
              | regex_replace(
                  '^' ~ (eveng_images_local_path | regex_escape) ~ '/?',
                  ''
                )
          }
        ]
      }}
  loop: "{{ eveng_images_local_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: eveng_images_local_path_stat.stat.isdir | default(false) | bool
  changed_when: false

- name: Fail if local source contains no images
  ansible.builtin.assert:
    that:
      - eveng_images_local_requested_files | length > 0
    fail_msg: "No image files found in {{ eveng_images_local_path }}"
  changed_when: false

- name: Create cache directory
  ansible.builtin.file:
    path: "{{ eveng_images_cache_dir }}"
    state: directory
    mode: "0755"

- name: Copy archive to cache
  ansible.builtin.copy:
    src: "{{ eveng_images_local_path }}"
    dest: "{{ eveng_images_cache_dir }}/{{ eveng_images_local_path | basename }}"
    mode: "0644"
  when: eveng_images_local_path_stat.stat.isreg | default(false) | bool

- name: Sync directory to cache
  ansible.posix.synchronize:
    src: "{{ eveng_images_local_path }}/"
    dest: "{{ eveng_images_cache_dir }}/"
    compress: false
    partial: true
    rsync_timeout: "{{ eveng_images_local_sync_timeout | int }}"
    use_ssh_args: true
    rsync_opts:
      - "--include=*/"
      - "--include=*.tar.gz"
      - "--include=*.tgz"
      - "--include=*.zip"
      - "--include=*.gz"
      - "--include=*.qcow2"
      - "--include=*.img"
      - "--include=*.bin"
      - "--exclude=*"
  when: eveng_images_local_path_stat.stat.isdir | default(false) | bool

- name: Inspect copied local images
  ansible.builtin.stat:
    path: "{{ eveng_images_cache_dir }}/{{ item.relative_path }}"
  loop: "{{ eveng_images_local_requested_files }}"
  loop_control:
    label: "{{ item.relative_path }}"
  register: eveng_images_local_cached_files
  changed_when: false

- name: Require every requested local image in the cache
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false) | bool
      - item.stat.isreg | default(false) | bool
    fail_msg: >-
      Local image was not copied to the target cache:
      {{ item.item.relative_path }}
  loop: "{{ eveng_images_local_cached_files.results | default([]) }}"
  loop_control:
    label: "{{ item.item.relative_path }}"

- name: Record download metadata
  ansible.builtin.set_fact:
    eveng_images_downloaded_files: >-
      {{
        eveng_images_local_cached_files.results
        | default([])
        | map(attribute='stat')
        | list
      }}
    eveng_images_run_at: "{{ ansible_date_time.iso8601 }}"
  changed_when: false

- name: Build image report and export logs
  ansible.builtin.include_tasks: report.yml
  when: eveng_images_generate_report | default(true) | bool
