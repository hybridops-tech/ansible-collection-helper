---
- name: Check EVE-NG labs root
  ansible.builtin.stat:
    path: "{{ eveng_lab_archive_labs_root }}"
  register: eveng_lab_archive_labs_root_stat

- name: Require EVE-NG labs root
  ansible.builtin.assert:
    that:
      - eveng_lab_archive_labs_root_stat.stat.isdir | default(false)
    fail_msg: "EVE-NG labs root does not exist: {{ eveng_lab_archive_labs_root }}"

- name: Check selected EVE-NG lab folders
  ansible.builtin.stat:
    path: "{{ eveng_lab_archive_labs_root }}/{{ item }}"
  loop: "{{ eveng_lab_archive_folders }}"
  register: eveng_lab_archive_selected_stats

- name: Require selected EVE-NG lab folders
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "EVE-NG lab folder does not exist: {{ item.item }}"
  loop: "{{ eveng_lab_archive_selected_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

- name: Prepare remote archive directory
  ansible.builtin.file:
    path: "{{ eveng_lab_archive_remote_dir }}"
    state: directory
    mode: "0700"

- name: Build EVE-NG lab archive
  ansible.builtin.command:
    argv: >-
      {{ ['tar', '--sort=name', '--mtime=@0', '--owner=0', '--group=0',
          '--numeric-owner', '-czf', eveng_lab_archive_remote_dir ~ '/labs.tar.gz',
          '-C', eveng_lab_archive_labs_root]
         + (eveng_lab_archive_folders if eveng_lab_archive_folders | length > 0 else ['.']) }}
  changed_when: true

- name: Ensure controller archive directory exists
  ansible.builtin.file:
    path: "{{ _eveng_lab_archive_path | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Fetch EVE-NG lab archive
  ansible.builtin.fetch:
    src: "{{ eveng_lab_archive_remote_dir }}/labs.tar.gz"
    dest: "{{ _eveng_lab_archive_candidate_path }}"
    flat: true

- name: Protect candidate controller archive
  ansible.builtin.file:
    path: "{{ _eveng_lab_archive_candidate_path }}"
    state: file
    mode: "0600"
  delegate_to: localhost
  become: false

- name: Verify fetched EVE-NG lab archive structure
  ansible.builtin.command:
    argv:
      - tar
      - -tzf
      - "{{ _eveng_lab_archive_candidate_path }}"
  delegate_to: localhost
  become: false
  changed_when: false
  register: eveng_lab_archive_controller_members

- name: Calculate controller archive checksum
  ansible.builtin.stat:
    path: "{{ _eveng_lab_archive_candidate_path }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: eveng_lab_archive_controller_stat

- name: Record archive creation time
  ansible.builtin.command:
    argv:
      - date
      - -u
      - +%Y-%m-%dT%H:%M:%SZ
  delegate_to: localhost
  become: false
  changed_when: false
  register: eveng_lab_archive_created_at

- name: Write candidate controller archive manifest
  ansible.builtin.copy:
    dest: "{{ _eveng_lab_archive_candidate_path }}.json"
    mode: "0600"
    content: >-
      {{ {
        'schema_version': 1,
        'kind': 'hybridops/eveng-lab-archive',
        'archive_file': _eveng_lab_archive_path | basename,
        'sha256': eveng_lab_archive_controller_stat.stat.checksum,
        'created_at': eveng_lab_archive_created_at.stdout,
        'folders': eveng_lab_archive_folders,
        'member_count': eveng_lab_archive_controller_members.stdout_lines | length,
        'device_configs': {
          'captured': eveng_lab_archive_device_config_results.captured,
          'labs': eveng_lab_archive_device_config_results.labs
        }
      } | to_nice_json }}
  delegate_to: localhost
  become: false

- name: Publish EVE-NG lab archive result
  ansible.builtin.set_fact:
    eveng_lab_archive_results:
      action: export
      archive_path: "{{ _eveng_lab_archive_path }}"
      sha256: "{{ eveng_lab_archive_controller_stat.stat.checksum }}"
      created_at: "{{ eveng_lab_archive_created_at.stdout }}"
      manifest_path: "{{ _eveng_lab_archive_path }}.json"
      folders: "{{ eveng_lab_archive_folders }}"
      member_count: "{{ eveng_lab_archive_controller_members.stdout_lines | length }}"
      device_configs_captured: >-
        {{ eveng_lab_archive_device_config_results.captured }}
      device_config_labs: "{{ eveng_lab_archive_device_config_results.labs }}"

- name: Remove remote archive staging
  ansible.builtin.file:
    path: "{{ eveng_lab_archive_remote_dir }}"
    state: absent
