---
- name: Require operator-supplied IOL licence material when requested
  ansible.builtin.assert:
    that:
      - eveng_images_iol_license_content | string | length > 0
    fail_msg: >-
      IOL licence material is required for this deployment. Store an authorised
      iourc file in the HybridOps environment vault before rerunning.
  when: eveng_images_iol_license_required | bool

- name: Validate the fixed EVE-NG IOL licence destination
  ansible.builtin.assert:
    that:
      - >-
        eveng_images_iol_license_path
        == eveng_images_addons_dir ~ '/iol/bin/iourc'
      - eveng_images_iol_license_owner == 'root'
      - eveng_images_iol_license_group == 'root'
    fail_msg: >-
      The EVE-NG IOL licence must use the fixed IOL destination and root
      ownership.

- name: Validate operator-supplied IOL licence material
  ansible.builtin.assert:
    that:
      - eveng_images_iol_license_content is string
      - eveng_images_iol_license_content | trim is match('(?s)^\[license\]\s+.+')
    fail_msg: "The supplied IOL licence file is not a valid iourc document."
  when: eveng_images_iol_license_content | string | length > 0
  no_log: true

- name: Resolve EVE-NG host keys for IOL licence validation
  ansible.builtin.set_fact:
    eveng_images_iol_license_host_keys: >-
      {{
        [
          ansible_hostname | default(''),
          ansible_fqdn | default('')
        ]
        | reject('equalto', '')
        | unique
        | list
      }}
  when: eveng_images_iol_license_content | string | length > 0
  changed_when: false

- name: Check IOL licence binding for this EVE-NG host
  ansible.builtin.set_fact:
    eveng_images_iol_license_matches_host: >-
      {{
        (
          eveng_images_iol_license_content
          | regex_search(
          '(?im)^[ ]*(?:'
          ~ (eveng_images_iol_license_host_keys | map('regex_escape') | join('|'))
          ~ ')[ ]*=[ ]*[0-9a-f]+;[ ]*$'
          )
        )
        is not none
      }}
  when:
    - eveng_images_iol_license_content | string | length > 0
    - eveng_images_iol_license_host_keys | default([]) | length > 0
  changed_when: false
  no_log: true

- name: Read EVE-NG host identifier for IOL licence diagnostics
  ansible.builtin.command: hostid
  register: eveng_images_iol_hostid_command
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - eveng_images_iol_license_content | string | length > 0
    - not (eveng_images_iol_license_matches_host | default(false) | bool)

- name: Resolve EVE-NG host identifier for IOL licence diagnostics
  ansible.builtin.set_fact:
    eveng_images_iol_host_identifier: >-
      {{
        eveng_images_iol_hostid_command.stdout
        | default('')
        | trim
        | default('unavailable', true)
      }}
  when:
    - eveng_images_iol_license_content | string | length > 0
    - not (eveng_images_iol_license_matches_host | default(false) | bool)
  changed_when: false

- name: Require IOL licence binding for this EVE-NG host
  ansible.builtin.assert:
    that:
      - eveng_images_iol_license_matches_host | bool
    fail_msg: >-
      The supplied iourc document does not contain a licence entry for this
      EVE-NG host. Hostname:
      {{ eveng_images_iol_license_host_keys | first }}. Host ID:
      {{ eveng_images_iol_host_identifier | default('unavailable') }}. Obtain
      an authorised iourc for this host, update EVENG_IOL_LICENSE, and rerun.
  when:
    - eveng_images_iol_license_content | string | length > 0
    - eveng_images_iol_license_host_keys | default([]) | length > 0
