---
# purpose: Download EVE-NG image archives from URL sources into a local cache
# maintainer: HybridOps.Tech

- name: Show planned image downloads
  ansible.builtin.debug:
    msg: >-
      Downloading {{ eveng_images_list | length }} image(s) into {{ eveng_images_cache_dir }}:
      {{ eveng_images_list | map(attribute='name') | list }}
  when: eveng_images_list is defined

- name: Validate image list is defined
  ansible.builtin.assert:
    that:
      - eveng_images_list is defined
      - (eveng_images_list | length) > 0
    fail_msg: "eveng_images_list must be defined with at least one image."

- name: Validate image entries
  ansible.builtin.assert:
    that:
      - item.url is defined
      - item.type is defined
      - item.type in ['iol', 'qemu', 'dynamips']
      - item.name is not defined or (item.name | basename) == item.name
      - item.label is not defined or (item.label | string | trim | length) > 0
    fail_msg: >-
      Each image must have 'url' and 'type' (iol, qemu, or dynamips).
      Optional names must be safe filenames and optional labels must not be empty.
  loop: "{{ eveng_images_list }}"
  loop_control:
    label: "{{ item.name | default(item.url) }}"

- name: Capture download run timestamp
  ansible.builtin.set_fact:
    eveng_images_run_at: "{{ ansible_date_time.iso8601 }}"

- name: Ensure download cache directory exists
  ansible.builtin.file:
    path: "{{ eveng_images_cache_dir }}"
    state: directory
    mode: "0755"

- name: Detect whether MEGA downloads are required
  ansible.builtin.set_fact:
    eveng_images_has_mega_downloads: >-
      {{ (eveng_images_list | selectattr('url', 'search', 'mega.nz') | list | length) > 0 }}

- name: Install MEGAcmd for MEGA downloads
  when: eveng_images_has_mega_downloads | bool
  block:
    - name: Check if MEGAcmd is installed
      ansible.builtin.command:
        argv:
          - which
          - mega-get
      register: eveng_images_megacmd_check
      failed_when: false
      changed_when: false

    - name: Install gdebi
      ansible.builtin.apt:
        name: gdebi-core
        state: present
        update_cache: true
      when: eveng_images_megacmd_check.rc != 0

    - name: Download MEGAcmd package
      ansible.builtin.get_url:
        url: "https://mega.nz/linux/repo/xUbuntu_22.04/amd64/megacmd-xUbuntu_22.04_amd64.deb"
        dest: "/tmp/megacmd.deb"
        mode: "0644"
      when: eveng_images_megacmd_check.rc != 0

    - name: Install MEGAcmd
      ansible.builtin.command: gdebi -n /tmp/megacmd.deb
      changed_when: true
      when: eveng_images_megacmd_check.rc != 0

    - name: Remove MEGAcmd package
      ansible.builtin.file:
        path: "/tmp/megacmd.deb"
        state: absent
      when: eveng_images_megacmd_check.rc != 0

    - name: Wait for MEGAcmd initialisation
      ansible.builtin.pause:
        seconds: 3
      when: eveng_images_megacmd_check.rc != 0

- name: Download from MEGA URLs
  ansible.builtin.shell: |
    set -e
    set -o pipefail

    log() {
      printf '%s [%s] %s\n' "$(date -Iseconds)" "{{ inventory_hostname }}" "$*"
    }

    cd "{{ eveng_images_cache_dir }}"

    FILENAME="$HYOPS_IMAGE_NAME"
    URL="$HYOPS_IMAGE_URL"
    SOURCE_ID="$(printf '%s' "$URL" | sha256sum | awk '{print $1}')"
    SOURCE_FILE=".${FILENAME}.hyops-source"

    if [ -f "$FILENAME" ]; then
      CACHED_SOURCE="$(cat "$SOURCE_FILE" 2>/dev/null || true)"
      if [ "${HYOPS_KEEP_CACHE,,}" = "true" ] && [ "$CACHED_SOURCE" = "$SOURCE_ID" ]; then
        log "File $FILENAME already exists for this source. Skipping."
        exit 0
      fi
      log "Refreshing cached file $FILENAME."
      rm -f -- "$FILENAME" "$SOURCE_FILE"
    fi

    DOWNLOAD_DIR="$(mktemp -d "${TMPDIR:-/tmp}/hyops-mega.XXXXXX")"
    DOWNLOAD_OUTPUT="$(mktemp "${TMPDIR:-/tmp}/hyops-mega-output.XXXXXX")"
    MEGA_LOG="${HOME}/.megaCmd/megacmdserver.log"
    MEGA_LOG_OFFSET=0
    if [ -f "$MEGA_LOG" ]; then
      MEGA_LOG_OFFSET="$(stat -c '%s' "$MEGA_LOG")"
    fi

    cleanup() {
      if [ -n "${MEGA_PID:-}" ] && kill -0 "$MEGA_PID" 2>/dev/null; then
        kill "$MEGA_PID" 2>/dev/null || true
        wait "$MEGA_PID" 2>/dev/null || true
      fi
      rm -rf "$DOWNLOAD_DIR"
      rm -f "$DOWNLOAD_OUTPUT"
    }
    trap cleanup EXIT

    log "Starting MEGA download for $FILENAME"
    log "URL: $URL"
    log "Timeout: 900 seconds"

    timeout --foreground --kill-after=5 900 \
      mega-get "$URL" "$DOWNLOAD_DIR" >"$DOWNLOAD_OUTPUT" 2>&1 &
    MEGA_PID=$!

    while kill -0 "$MEGA_PID" 2>/dev/null; do
      if [ -f "$MEGA_LOG" ]; then
        CURRENT_LOG_SIZE="$(stat -c '%s' "$MEGA_LOG")"
        if [ "$CURRENT_LOG_SIZE" -lt "$MEGA_LOG_OFFSET" ]; then
          MEGA_LOG_OFFSET=0
        fi
        if tail -c "+$((MEGA_LOG_OFFSET + 1))" "$MEGA_LOG" \
          | grep -Fq "Reached bandwidth quota"; then
          kill "$MEGA_PID" 2>/dev/null || true
          wait "$MEGA_PID" 2>/dev/null || true
          mega-transfers -c -a --only-downloads >/dev/null 2>&1 || true
          log "MEGA transfer quota reached; use another authorised source or retry after the quota resets."
          exit 75
        fi
      fi
      sleep 2
    done

    set +e
    wait "$MEGA_PID"
    RC=$?
    set -e
    MEGA_PID=""
    cat "$DOWNLOAD_OUTPUT"

    if [ $RC -ne 0 ]; then
      if [ $RC -eq 124 ]; then
        log "Download timed out after 900 seconds."
      else
        log "Download failed with error code $RC."
      fi
      exit $RC
    fi

    sleep 2

    mapfile -t DOWNLOADED_FILES < <(
      find "$DOWNLOAD_DIR" -type f \
        \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.zip' -o -name '*.gz' \) \
        | sort
    )

    DOWNLOADED_COUNT="$(printf '%s\n' "${DOWNLOADED_FILES[@]}" | sed '/^$/d' | wc -l | tr -d ' ')"

    if [ "$DOWNLOADED_COUNT" -ne 1 ]; then
      log "Expected one archive from MEGA, found $DOWNLOADED_COUNT."
      find "$DOWNLOAD_DIR" -maxdepth 3 -type f -printf '%P\n' || true
      exit 1
    fi

    DOWNLOADED="${DOWNLOADED_FILES[0]}"
    log "Detected downloaded file: $DOWNLOADED"

    log "Installing downloaded archive as $FILENAME"
    mv "$DOWNLOADED" "$FILENAME"

    if [ ! -f "$FILENAME" ]; then
      log "File $FILENAME not found after rename."
      exit 1
    fi

    printf '%s\n' "$SOURCE_ID" > "$SOURCE_FILE"

    SIZE="$(du -h "$FILENAME" | cut -f1)"
    log "Completed MEGA download: $FILENAME ($SIZE)"
  args:
    executable: /bin/bash
  environment:
    HYOPS_IMAGE_NAME: >-
      {{ item.name | default(
        'mega-download-' ~ (item.url | hash('md5'))[:8] ~ '.tar.gz'
      ) }}
    HYOPS_IMAGE_URL: "{{ item.url }}"
    HYOPS_KEEP_CACHE: "{{ eveng_images_keep_cache | default(true) | bool }}"
  loop: "{{ eveng_images_list }}"
  loop_control:
    label: "{{ item.name | default(item.url) }}"
  register: eveng_images_mega_download_result
  changed_when: >-
    'already exists for this source. Skipping.' not in
    (eveng_images_mega_download_result.stdout | default(''))
  when: "'mega.nz' in (item.url | default(''))"

- name: Download from non-MEGA URLs
  ansible.builtin.shell: |
    set -e
    set -o pipefail

    log() {
      printf '%s [%s] %s\n' "$(date -Iseconds)" "{{ inventory_hostname }}" "$*"
    }

    cd "{{ eveng_images_cache_dir }}"

    FILENAME="$HYOPS_IMAGE_NAME"
    URL="$HYOPS_IMAGE_URL"
    SOURCE_ID="$(printf '%s' "$URL" | sha256sum | awk '{print $1}')"
    SOURCE_FILE=".${FILENAME}.hyops-source"

    if [ -f "$FILENAME" ]; then
      CACHED_SOURCE="$(cat "$SOURCE_FILE" 2>/dev/null || true)"
      if [ "${HYOPS_KEEP_CACHE,,}" = "true" ] && [ "$CACHED_SOURCE" = "$SOURCE_ID" ]; then
        log "File $FILENAME already exists for this source. Skipping."
        exit 0
      fi
      log "Refreshing cached file $FILENAME."
      rm -f -- "$FILENAME" "$SOURCE_FILE"
    fi

    log "Starting HTTP download for $FILENAME"
    log "URL: $URL"
    log "Timeout: 900 seconds"

    PART_FILE="$(mktemp "./.${FILENAME}.part.XXXXXX")"
    trap 'rm -f -- "$PART_FILE"' EXIT

    timeout 900 curl \
      --fail \
      --show-error \
      --location \
      --progress-bar \
      --connect-timeout 30 \
      -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
      -o "$PART_FILE" \
      "$URL" || {
      RC=$?
      if [ $RC -eq 124 ]; then
        log "Download timed out after 900 seconds."
      else
        log "Download failed with error code $RC."
      fi
      exit $RC
    }

    if [ ! -s "$PART_FILE" ]; then
      log "Download produced an empty file."
      exit 1
    fi

    mv -f -- "$PART_FILE" "$FILENAME"
    trap - EXIT

    printf '%s\n' "$SOURCE_ID" > "$SOURCE_FILE"

    SIZE="$(du -h "$FILENAME" | cut -f1)"
    log "Completed HTTP download: $FILENAME ($SIZE)"
  args:
    executable: /bin/bash
  environment:
    HYOPS_IMAGE_NAME: >-
      {{ item.name | default(
        'http-download-' ~ (item.url | hash('md5'))[:8] ~ '.tar.gz'
      ) }}
    HYOPS_IMAGE_URL: "{{ item.url }}"
    HYOPS_KEEP_CACHE: "{{ eveng_images_keep_cache | default(true) | bool }}"
  loop: "{{ eveng_images_list }}"
  loop_control:
    label: "{{ item.name | default(item.url) }}"
  register: eveng_images_http_download_result
  changed_when: >-
    'already exists for this source. Skipping.' not in
    (eveng_images_http_download_result.stdout | default(''))
  when: "'mega.nz' not in (item.url | default(''))"

- name: Check every requested image archive is present
  ansible.builtin.stat:
    path: >-
      {{ eveng_images_cache_dir }}/{{
        item.name | default(
          ('mega-download-' if 'mega.nz' in (item.url | default('')) else 'http-download-')
          ~ (item.url | hash('md5'))[:8] ~ '.tar.gz'
        )
      }}
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: "{{ eveng_images_list }}"
  loop_control:
    label: "{{ item.name | default(item.url) }}"
  register: eveng_images_requested_archives

- name: Fail when a requested image archive is missing
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: >-
      Requested image archive was not downloaded: {{ item.item.name | default(item.item.url) }}
  loop: "{{ eveng_images_requested_archives.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default(item.item.url) }}"

- name: Record requested download metadata
  ansible.builtin.set_fact:
    eveng_images_downloaded_files: >-
      {{
        eveng_images_requested_archives.results
        | map(attribute='stat')
        | list
      }}

- name: Build image report and export logs
  ansible.builtin.include_tasks: report.yml
  when: eveng_images_generate_report | default(true) | bool
