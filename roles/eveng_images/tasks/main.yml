---
# Main orchestrator for EVE-NG image deployment

- name: Validate EVE-NG image settings
  ansible.builtin.include_tasks: validate.yml

- name: Ensure EVE-NG directories exist
  ansible.builtin.file:
    path: "{{ eveng_images_addons_dir }}/{{ item }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  loop:
    - qemu
    - iol
    - iol/bin
    - iol/lib
    - dynamips

- name: Download images
  ansible.builtin.include_tasks: "download-{{ eveng_images_source }}.yml"
  when: eveng_images_download | default(true)

- name: Install images
  ansible.builtin.include_tasks: install.yml
  when: eveng_images_install | default(true)
