---
- name: Check for running EVE-NG QEMU nodes
  ansible.builtin.shell: |
    set -o pipefail
    pgrep -af '[/]opt/qemu[^ ]*/bin/qemu-system-' || true
  args:
    executable: /bin/bash
  changed_when: false
  register: eveng_lab_archive_running_qemu

- name: Require stopped QEMU nodes
  ansible.builtin.assert:
    that:
      - eveng_lab_archive_running_qemu.stdout | trim | length == 0
    fail_msg: >-
      QEMU nodes are running. Stop the lab nodes before restoring node state.

- name: Inspect controller node-state archive
  ansible.builtin.stat:
    path: "{{ _eveng_lab_archive_node_state_path }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: eveng_lab_archive_node_state_controller_stat

- name: Verify controller node-state archive
  ansible.builtin.assert:
    that:
      - eveng_lab_archive_node_state_controller_stat.stat.isreg | default(false)
      - >-
        eveng_lab_archive_node_state_controller_stat.stat.checksum | lower
        == eveng_lab_archive_node_state_expected_sha256 | lower
    fail_msg: >-
      EVE-NG node-state archive is missing or its SHA-256 checksum does not
      match

- name: List controller node-state archive members
  ansible.builtin.command:
    argv:
      - tar
      - -tf
      - "{{ _eveng_lab_archive_node_state_path }}"
  delegate_to: localhost
  become: false
  changed_when: false
  register: eveng_lab_archive_node_state_members

- name: Inspect controller node-state archive member types
  ansible.builtin.command:
    argv:
      - tar
      - -tvf
      - "{{ _eveng_lab_archive_node_state_path }}"
  delegate_to: localhost
  become: false
  changed_when: false
  register: eveng_lab_archive_node_state_member_types

- name: Select EVE-NG node-state archive members
  ansible.builtin.set_fact:
    eveng_lab_archive_node_state_overlay_members: >-
      {{
        eveng_lab_archive_node_state_members.stdout_lines
        | select('match', '^[0-9]+/[^/]+/[0-9]+/[^/]+\.qcow2$')
        | list
      }}
    eveng_lab_archive_node_state_metadata_present: >-
      {{
        'hybridops/capture.json'
        in eveng_lab_archive_node_state_members.stdout_lines
      }}

- name: Reject unsafe node-state archive members
  ansible.builtin.assert:
    that:
      - >-
        eveng_lab_archive_node_state_members.stdout_lines
        | reject('match', '(^/|(^|/)\.\.(/|$))')
        | list
        | length == eveng_lab_archive_node_state_members.stdout_lines | length
      - >-
        eveng_lab_archive_node_state_members.stdout_lines
        | reject('match', '^[0-9]+/[^/]+/[0-9]+/[^/]+\.qcow2$')
        | reject('equalto', 'hybridops/capture.json')
        | list
        | length == 0
      - >-
        eveng_lab_archive_node_state_member_types.stdout_lines
        | select('match', '^[lh]')
        | list
        | length == 0
    fail_msg: "EVE-NG node-state archive contains an unsafe member"

- name: Require EVE-NG node-state member layout
  ansible.builtin.assert:
    that:
      - >-
        item is match('^[0-9]+/[^/]+/[0-9]+/[^/]+\.qcow2$')
        or item == 'hybridops/capture.json'
    fail_msg: "EVE-NG node-state archive member has an invalid path: {{ item }}"
  loop: "{{ eveng_lab_archive_node_state_members.stdout_lines }}"
  loop_control:
    label: "{{ item }}"

- name: Read EVE-NG node-state capture metadata
  ansible.builtin.command:
    argv:
      - tar
      - -xOf
      - "{{ _eveng_lab_archive_node_state_path }}"
      - hybridops/capture.json
  delegate_to: localhost
  become: false
  changed_when: false
  register: eveng_lab_archive_node_state_metadata_raw
  when: eveng_lab_archive_node_state_metadata_present | bool

- name: Parse EVE-NG node-state capture metadata
  ansible.builtin.set_fact:
    eveng_lab_archive_node_state_metadata: >-
      {{ eveng_lab_archive_node_state_metadata_raw.stdout | from_json }}
  when: eveng_lab_archive_node_state_metadata_present | bool

- name: Validate EVE-NG node-state capture metadata
  ansible.builtin.assert:
    that:
      - >-
        eveng_lab_archive_node_state_metadata.schema
        == 'hybridops.eve-node-state-capture/v1'
      - >-
        eveng_lab_archive_node_state_metadata.quiescence.method
        in ['operator-attestation', 'operator-script']
      - >-
        eveng_lab_archive_node_state_metadata.quiescence.qemu_processes_absent
        is sameas true
      - >-
        eveng_lab_archive_node_state_metadata.quiescence.method
        != 'operator-script'
        or eveng_lab_archive_node_state_metadata.quiescence.script_sha256
           is match('^[0-9a-f]{64}$')
    fail_msg: "EVE-NG node-state capture metadata is invalid"
  when: eveng_lab_archive_node_state_metadata_present | bool

- name: Measure expanded EVE-NG node-state archive
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -c
      - >-
        import sys,tarfile; archive=tarfile.open(sys.argv[1], 'r:*');
        print(sum(member.size for member in archive if member.isfile()));
        archive.close()
      - "{{ _eveng_lab_archive_node_state_path }}"
  delegate_to: localhost
  become: false
  changed_when: false
  register: eveng_lab_archive_node_state_expanded_size

- name: Initialise restored EVE-NG tenant paths
  ansible.builtin.set_fact:
    eveng_lab_archive_node_state_tenants: []
    eveng_lab_archive_node_state_lab_roots: []

- name: Resolve restored EVE-NG tenant paths
  ansible.builtin.set_fact:
    eveng_lab_archive_node_state_tenants: >-
      {{
        (eveng_lab_archive_node_state_tenants + [item.split('/')[0]])
        | unique
        | sort
      }}
    eveng_lab_archive_node_state_lab_roots: >-
      {{
        (
          eveng_lab_archive_node_state_lab_roots
          + [item.split('/')[0] ~ '/' ~ item.split('/')[1]]
        )
        | unique
        | sort
      }}
  loop: "{{ eveng_lab_archive_node_state_overlay_members }}"
  loop_control:
    label: "{{ item }}"

- name: Inspect existing node-state paths
  ansible.builtin.stat:
    path: "{{ eveng_lab_archive_node_state_root }}/{{ item }}"
  loop: "{{ eveng_lab_archive_node_state_overlay_members }}"
  register: eveng_lab_archive_existing_node_state
  when: not eveng_lab_archive_overwrite | bool

- name: Protect existing node state
  ansible.builtin.assert:
    that:
      - not item.stat.exists
    fail_msg: >-
      EVE-NG node state already exists: {{ item.item }}. Enable overwrite only
      when replacing it is intended.
  loop: "{{ eveng_lab_archive_existing_node_state.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: not eveng_lab_archive_overwrite | bool

- name: Ensure EVE-NG node-state root exists
  ansible.builtin.file:
    path: "{{ eveng_lab_archive_node_state_root }}"
    state: directory
    owner: "{{ eveng_lab_archive_owner }}"
    group: "{{ eveng_lab_archive_group }}"
    mode: "0755"

- name: Read EVE-NG node-state filesystem capacity
  ansible.builtin.command:
    argv:
      - df
      - -Pk
      - "{{ eveng_lab_archive_node_state_root }}"
  environment:
    LC_ALL: C
  changed_when: false
  register: eveng_lab_archive_node_state_disk_capacity

- name: Resolve EVE-NG node-state restore capacity
  ansible.builtin.set_fact:
    eveng_lab_archive_node_state_available_bytes: >-
      {{
        (
          eveng_lab_archive_node_state_disk_capacity.stdout_lines[-1].split()[3]
          | int
        ) * 1024
      }}
    eveng_lab_archive_node_state_required_bytes: >-
      {{
        (eveng_lab_archive_node_state_controller_stat.stat.size | int)
        + (eveng_lab_archive_node_state_expanded_size.stdout | int)
        + (eveng_lab_archive_restore_free_reserve_bytes | int)
      }}

- name: Require EVE-NG node-state restore capacity
  ansible.builtin.assert:
    that:
      - >-
        eveng_lab_archive_node_state_available_bytes | int
        >= eveng_lab_archive_node_state_required_bytes | int
    fail_msg: >-
      Insufficient disk space to restore EVE-NG node state: required
      {{ eveng_lab_archive_node_state_required_bytes }} bytes, available
      {{ eveng_lab_archive_node_state_available_bytes }} bytes on the filesystem
      containing {{ eveng_lab_archive_node_state_root }}.

- name: Restore EVE-NG node state
  ansible.builtin.unarchive:
    src: "{{ _eveng_lab_archive_node_state_path }}"
    dest: "{{ eveng_lab_archive_node_state_root }}"
    owner: "{{ eveng_lab_archive_owner }}"
    group: "{{ eveng_lab_archive_group }}"
    remote_src: false

- name: Remove restored node-state capture metadata
  ansible.builtin.file:
    path: "{{ eveng_lab_archive_node_state_root }}/hybridops"
    state: absent
  when: eveng_lab_archive_node_state_metadata_present | bool

- name: Restore EVE-NG tenant root ownership
  ansible.builtin.file:
    path: "{{ eveng_lab_archive_node_state_root }}/{{ item }}"
    state: directory
    owner: >-
      {{
        (eveng_lab_archive_tenant_uid_base | int)
        + (item | int)
      }}
    group: "{{ eveng_lab_archive_tenant_gid }}"
    mode: "2775"
  loop: "{{ eveng_lab_archive_node_state_tenants }}"
  loop_control:
    label: "tenant {{ item }}"

- name: Restore EVE-NG lab runtime ownership
  ansible.builtin.file:
    path: "{{ eveng_lab_archive_node_state_root }}/{{ item }}"
    state: directory
    owner: >-
      {{
        (eveng_lab_archive_tenant_uid_base | int)
        + (item.split('/')[0] | int)
      }}
    group: "{{ eveng_lab_archive_tenant_gid }}"
    recurse: true
  loop: "{{ eveng_lab_archive_node_state_lab_roots }}"
  loop_control:
    label: "{{ item }}"

- name: Select available qemu-img command
  ansible.builtin.shell: |
    set -eu
    if [ -x {{ eveng_lab_archive_qemu_img | quote }} ]; then
      printf '%s\n' {{ eveng_lab_archive_qemu_img | quote }}
    else
      command -v qemu-img
    fi
  args:
    executable: /bin/bash
  changed_when: false
  register: eveng_lab_archive_qemu_img_command

- name: Inspect restored EVE-NG QEMU overlays
  ansible.builtin.command:
    argv:
      - "{{ eveng_lab_archive_qemu_img_command.stdout | trim }}"
      - check
      - -q
      - "{{ eveng_lab_archive_node_state_root }}/{{ item }}"
  loop: "{{ eveng_lab_archive_node_state_overlay_members }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
  failed_when: eveng_lab_archive_overlay_check.rc not in [0, 3]
  register: eveng_lab_archive_overlay_check

- name: Select restored overlays with leaked clusters
  ansible.builtin.set_fact:
    eveng_lab_archive_node_state_leak_files: >-
      {{
        eveng_lab_archive_overlay_check.results
        | selectattr('rc', 'equalto', 3)
        | map(attribute='item')
        | list
      }}

- name: Report retained QCOW2 leaked clusters
  ansible.builtin.debug:
    msg: >-
      Restored QCOW2 overlays report leaked clusters and were retained without
      mutation: {{ eveng_lab_archive_node_state_leak_files | join(', ') }}
  when: eveng_lab_archive_node_state_leak_files | length > 0

- name: Publish EVE-NG node-state restore result
  ansible.builtin.set_fact:
    eveng_lab_archive_results: >-
      {{
        eveng_lab_archive_results
        | combine({
          'node_state_included': true,
          'node_state_restored': true,
          'node_state_archive_path': _eveng_lab_archive_node_state_path,
          'node_state_sha256':
            eveng_lab_archive_node_state_controller_stat.stat.checksum,
          'node_state_files':
            eveng_lab_archive_node_state_overlay_members | length,
          'node_state_leak_files':
            eveng_lab_archive_node_state_leak_files,
          'quiescence_method': (
            eveng_lab_archive_node_state_metadata.quiescence.method
            if eveng_lab_archive_node_state_metadata_present
            else 'unrecorded'
          ),
          'quiescence_script_sha256': (
            eveng_lab_archive_node_state_metadata.quiescence.script_sha256
            | default('')
            if eveng_lab_archive_node_state_metadata_present
            else ''
          ),
          'quiescence_verified_at': (
            eveng_lab_archive_node_state_metadata.quiescence.verified_at
            | default('')
            if eveng_lab_archive_node_state_metadata_present
            else ''
          )
        })
      }}
