---
# purpose: Install one detected EVE-NG image into the addons tree
# maintainer: HybridOps.Tech

- name: Install detected image content
  ansible.builtin.shell: |
    set -euo pipefail

    archive="$HYOPS_IMAGE_ARCHIVE"
    detected="$HYOPS_IMAGE_TYPE"
    basename="$(basename "$archive")"
    image_type="${detected#structured:}"
    image_type="${image_type#raw:}"
    destination="$HYOPS_ADDONS_DIR/$image_type"
    work_dir="$(mktemp -d "${TMPDIR:-/tmp}/hyops-image.XXXXXX")"
    trap 'rm -rf "$work_dir"' EXIT

    case "$image_type" in
      qemu|iol|dynamips) ;;
      *)
        printf 'Unsupported image type: %s\n' "$detected" >&2
        exit 1
        ;;
    esac

    mkdir -p "$destination"

    case "$detected" in
      raw:qemu)
        if [ "$HYOPS_RAW_QEMU_LAYOUT" = "foldered" ]; then
          image_name="${basename%.qcow2}"
          image_name="${image_name%.img}"
          installed_path="$destination/$image_name"
          mkdir -p "$installed_path"
          cp -f "$archive" "$installed_path/$HYOPS_RAW_QEMU_DISK_NAME"
        else
          installed_path="$destination/$basename"
          cp -f "$archive" "$installed_path"
        fi
        ;;
      raw:iol)
        installed_path="$destination/bin/$basename"
        mkdir -p "$destination/bin"
        cp -f "$archive" "$installed_path"
        ;;
      *)
        wrapped_layout=false
        case "$archive" in
          *.tar.gz|*.tgz|*.gz)
            if tar -tzf "$archive" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
              printf 'Unsafe archive path detected: %s\n' "$archive" >&2
              exit 1
            fi
            tar -xzf "$archive" -C "$work_dir"
            ;;
          *.zip)
            if unzip -Z1 "$archive" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
              printf 'Unsafe archive path detected: %s\n' "$archive" >&2
              exit 1
            fi
            unzip -q "$archive" -d "$work_dir"
            ;;
          *)
            printf 'Unsupported image archive: %s\n' "$archive" >&2
            exit 1
            ;;
        esac

        if [ "$image_type" = "iol" ]; then
          if find "$work_dir" -type f \( -iname 'iourc' -o -iname '.iourc' \) -print -quit \
            | grep -q .; then
            printf 'IOL licence material must be supplied through the encrypted secret input: %s\n' "$archive" >&2
            exit 1
          fi

          if [ -d "$work_dir/opt/unetlab/addons/iol" ]; then
            source_dir="$work_dir/opt/unetlab/addons/iol"
            cp -a "$source_dir/." "$destination/"
            installed_path="$destination"
          elif [ -d "$work_dir/iol" ]; then
            source_dir="$work_dir/iol"
            cp -a "$source_dir/." "$destination/"
            installed_path="$destination"
          else
            mapfile -t iol_binaries < <(find "$work_dir" -type f -iname '*.bin' -print | sort)
            iol_binary_count="$(printf '%s\n' "${iol_binaries[@]}" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [ "$iol_binary_count" -eq 0 ]; then
              printf 'IOL archive contains no .bin image: %s\n' "$archive" >&2
              exit 1
            fi
            mkdir -p "$destination/bin"
            for binary in "${iol_binaries[@]}"; do
              cp -f "$binary" "$destination/bin/$(basename "$binary")"
            done
            installed_path="$destination/bin"
          fi

          printf '%s\n' "$installed_path"
          exit 0
        fi

        if [[ "$basename" =~ ^BIGIP-(.+)\.ALL\.qcow2\.zip$ ]]; then
          image_version="${BASH_REMATCH[1],,}"
          destination="$HYOPS_ADDONS_DIR/qemu/bigip-$image_version"
          mapfile -t system_disks < <(
            find "$work_dir" -type f -iname '*.qcow2' ! -iname '*datastor*' -print | sort
          )
          mapfile -t datastore_disks < <(
            find "$work_dir" -type f -iname '*datastor*.qcow2' -print | sort
          )
          system_disk_count="$(printf '%s\n' "${system_disks[@]}" | sed '/^$/d' | wc -l | tr -d ' ')"
          datastore_disk_count="$(printf '%s\n' "${datastore_disks[@]}" | sed '/^$/d' | wc -l | tr -d ' ')"

          if [ "$system_disk_count" -ne 1 ]; then
            printf 'F5 BIG-IP archive must contain exactly one system disk: %s\n' "$archive" >&2
            exit 1
          fi
          if [ "$datastore_disk_count" -gt 1 ]; then
            printf 'F5 BIG-IP archive contains more than one datastore disk: %s\n' "$archive" >&2
            exit 1
          fi

          mkdir -p "$destination"
          cp -f "${system_disks[0]}" "$destination/virtioa.qcow2"
          if [ "$datastore_disk_count" -eq 1 ]; then
            cp -f "${datastore_disks[0]}" "$destination/virtiob.qcow2"
          fi
          installed_path="$destination"
          printf '%s\n' "$installed_path"
          exit 0
        fi

        if [ -d "$work_dir/opt/unetlab/addons/$image_type" ]; then
          source_dir="$work_dir/opt/unetlab/addons/$image_type"
        elif [ -d "$work_dir/$image_type" ]; then
          source_dir="$work_dir/$image_type"
        else
          mapfile -t top_entries < <(find "$work_dir" -mindepth 1 -maxdepth 1 -print | sort)
          if [ "$(printf '%s\n' "${top_entries[@]}" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 1 ] \
            && [ -d "${top_entries[0]}" ]; then
            source_dir="$work_dir"
          else
            image_name="$basename"
            image_name="${image_name%.tar.gz}"
            image_name="${image_name%.tgz}"
            image_name="${image_name%.zip}"
            image_name="${image_name%.gz}"
            source_dir="$work_dir"
            mkdir -p "$destination/$image_name"
            destination="$destination/$image_name"
            wrapped_layout=true
          fi
        fi

        first_source_entry="$(find "$source_dir" -mindepth 1 -maxdepth 1 -print | sort | head -1)"
        if [ -z "$first_source_entry" ]; then
          printf 'Archive produced no installable content: %s\n' "$archive" >&2
          exit 1
        fi

        cp -a "$source_dir/." "$destination/"

        if [ "$wrapped_layout" = true ]; then
          installed_path="$destination"
        else
          installed_path="$destination/$(basename "$first_source_entry")"
        fi
        ;;
    esac

    printf '%s\n' "$installed_path"
  args:
    executable: /bin/bash
  environment:
    HYOPS_IMAGE_ARCHIVE: "{{ image_detection.item.path }}"
    HYOPS_IMAGE_TYPE: "{{ image_detection.stdout | trim }}"
    HYOPS_ADDONS_DIR: "{{ eveng_images_addons_dir }}"
    HYOPS_RAW_QEMU_LAYOUT: "{{ eveng_images_raw_qemu_layout }}"
    HYOPS_RAW_QEMU_DISK_NAME: "{{ eveng_images_raw_qemu_disk_name }}"
  register: eveng_images_installed_image
  changed_when: true

- name: Record installed image path
  ansible.builtin.set_fact:
    eveng_images_installed_paths: >-
      {{ (eveng_images_installed_paths | default([])) + [eveng_images_installed_image.stdout_lines | last] }}
