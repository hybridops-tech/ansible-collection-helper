---
# purpose: Install EVE-NG images from cache into the addons tree
# maintainer: HybridOps.Tech

- name: Discover installable files when metadata is not provided
  ansible.builtin.find:
    paths: "{{ eveng_images_cache_dir }}"
    patterns:
      - "*.tar.gz"
      - "*.tgz"
      - "*.zip"
      - "*.gz"
      - "*.qcow2"
      - "*.img"
      - "*.bin"
    recurse: false
  register: eveng_images_install_files
  when: eveng_images_downloaded_files is not defined

- name: Use previously discovered download metadata when available
  ansible.builtin.set_fact:
    eveng_images_install_files:
      files: "{{ eveng_images_downloaded_files }}"
  when: eveng_images_downloaded_files is defined
  changed_when: false

- name: Fail when there is nothing to install
  ansible.builtin.fail:
    msg: "No archives or images found to install in {{ eveng_images_cache_dir }}"
  when: (eveng_images_install_files.files | default([]) | length) == 0

- name: Detect type for each file
  ansible.builtin.shell: |
    set -euo pipefail
    ARCHIVE="{{ item.path }}"
    BASENAME="$(basename "$ARCHIVE")"
    EXT="${BASENAME##*.}"
    MIME_TYPE="$(file --brief --mime-type "$ARCHIVE" 2>/dev/null || true)"

    case "$EXT" in
      qcow2|img)
        if ! command -v qemu-img >/dev/null 2>&1; then
          echo "invalid:qemu-img-unavailable"
          exit 0
        fi
        if ! qemu-img info --output=json "$ARCHIVE" >/dev/null 2>&1; then
          echo "invalid:qemu-disk"
          exit 0
        fi
        case "$MIME_TYPE" in
          text/*|application/json|application/xml)
            echo "invalid:qemu-content"
            exit 0
            ;;
        esac
        if [ "$EXT" = "qcow2" ] \
          && ! qemu-img info --output=json "$ARCHIVE" \
            | grep -Eq '"format"[[:space:]]*:[[:space:]]*"qcow2"'; then
          echo "invalid:qemu-format"
          exit 0
        fi
        echo "raw:qemu"
        exit 0
        ;;
      bin)
        case "$MIME_TYPE" in
          text/*|application/json|application/xml)
            echo "invalid:binary-content"
            exit 0
            ;;
        esac
        echo "raw:iol"
        exit 0
        ;;
    esac

    {% if eveng_images_list is defined %}
    # Metadata mapping for archives
    case "$BASENAME" in
    {% for img in eveng_images_list if img.name is defined %}
      "{{ img.name }}")
        echo "{{ img.type }}"
        exit 0
        ;;
    {% endfor %}
    esac
    {% endif %}

    case "$BASENAME" in
      *.tar.gz|*.tgz|*.gz)
        GZIP_MAGIC="$(od -An -tx1 -N2 "$ARCHIVE" | tr -d ' \n')"
        if [ "$GZIP_MAGIC" = "1f8b" ]; then
          if ! LIST_OUTPUT="$(tar -tzf "$ARCHIVE" 2>/dev/null)"; then
            echo "invalid:tar-archive"
            exit 0
          fi
        elif ! LIST_OUTPUT="$(tar -tf - 2>/dev/null < "$ARCHIVE")"; then
          echo "invalid:tar-archive"
          exit 0
        fi
        ;;
      *.zip)
        if ! LIST_OUTPUT="$(unzip -Z1 "$ARCHIVE" 2>/dev/null)"; then
          echo "invalid:zip-archive"
          exit 0
        fi
        ;;
      *)
        echo "qemu"
        exit 0
        ;;
    esac

    if [ -z "$LIST_OUTPUT" ]; then
      echo "invalid:empty-archive"
      exit 0
    fi

    FIRST_ENTRY="${LIST_OUTPUT%%$'\n'*}"
    FIRST_DIR="$(printf '%s\n' "$FIRST_ENTRY" | cut -d'/' -f1)"

    if [[ "$FIRST_DIR" == "iol" || "$FIRST_DIR" == "qemu" || "$FIRST_DIR" == "dynamips" ]]; then
      echo "structured:$FIRST_DIR"
      exit 0
    fi

    if [[ "$BASENAME" == iol-* ]]; then
      echo "iol"
      exit 0
    fi

    echo "qemu"
  args:
    executable: /bin/bash
  loop: "{{ eveng_images_install_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  register: eveng_images_detected_types
  changed_when: false

- name: Fail when an image archive is invalid
  ansible.builtin.assert:
    that:
      - not (item.stdout | trim).startswith('invalid')
    fail_msg: >-
      Invalid image file: {{ item.item.path }}
      ({{ item.stdout | trim }}).
  loop: "{{ eveng_images_detected_types.results | default([]) }}"
  loop_control:
    label: "{{ item.item.path | basename }}"

- name: Inspect image installation manifest
  ansible.builtin.stat:
    path: "{{ eveng_images_install_manifest_path }}"
  register: eveng_images_install_manifest_stat

- name: Read image installation manifest
  ansible.builtin.slurp:
    path: "{{ eveng_images_install_manifest_path }}"
  register: eveng_images_install_manifest_content
  when: eveng_images_install_manifest_stat.stat.isreg | default(false)

- name: Resolve image installation manifest
  ansible.builtin.set_fact:
    eveng_images_install_manifest: >-
      {{
        (eveng_images_install_manifest_content.content | b64decode | from_json)
        if eveng_images_install_manifest_stat.stat.isreg | default(false)
        else {'schema_version': 1, 'images': {}}
      }}
  changed_when: false

- name: Validate image installation manifest
  ansible.builtin.assert:
    that:
      - eveng_images_install_manifest is mapping
      - eveng_images_install_manifest.schema_version | default(0) == 1
      - eveng_images_install_manifest.images | default({}) is mapping
    fail_msg: >-
      Invalid EVE-NG image installation manifest:
      {{ eveng_images_install_manifest_path }}

- name: Initialise image installation candidates
  ansible.builtin.set_fact:
    eveng_images_install_candidates: []
  changed_when: false

- name: Build image installation candidates
  ansible.builtin.set_fact:
    eveng_images_install_candidates: >-
      {{
        (eveng_images_install_candidates | default([]))
        + [{
          'detection': item,
          'key': item.item.path | regex_replace(
            '^' ~ (eveng_images_cache_dir | regex_escape) ~ '/?',
            ''
          ),
          'size': item.item.size,
          'mtime': item.item.mtime | string,
          'installed_path': (
            eveng_images_install_manifest.images
            | default({})
          ).get(
            item.item.path | regex_replace(
              '^' ~ (eveng_images_cache_dir | regex_escape) ~ '/?',
              ''
            ),
            {}
          ).get('installed_path', ''),
          'recorded_sha256': (
            eveng_images_install_manifest.images
            | default({})
          ).get(
            item.item.path | regex_replace(
              '^' ~ (eveng_images_cache_dir | regex_escape) ~ '/?',
              ''
            ),
            {}
          ).get('sha256', ''),
          'recorded_size': (
            eveng_images_install_manifest.images
            | default({})
          ).get(
            item.item.path | regex_replace(
              '^' ~ (eveng_images_cache_dir | regex_escape) ~ '/?',
              ''
            ),
            {}
          ).get('size', -1),
          'recorded_mtime': (
            eveng_images_install_manifest.images
            | default({})
          ).get(
            item.item.path | regex_replace(
              '^' ~ (eveng_images_cache_dir | regex_escape) ~ '/?',
              ''
            ),
            {}
          ).get('mtime', '') | string
        }]
      }}
  loop: "{{ eveng_images_detected_types.results | default([]) }}"
  loop_control:
    label: "{{ item.item.path | basename }}"
  changed_when: false

- name: Inspect unchanged installed images
  ansible.builtin.stat:
    path: "{{ item.installed_path }}"
  loop: "{{ eveng_images_install_candidates | default([]) }}"
  loop_control:
    label: "{{ item.key }}"
  register: eveng_images_reuse_checks
  when:
    - item.installed_path | length > 0
    - item.recorded_sha256 is match('^[0-9a-f]{64}$')
    - item.recorded_size | int == item.size | int
    - item.recorded_mtime == item.mtime

- name: Initialise image installation plan
  ansible.builtin.set_fact:
    eveng_images_pending_installations: []
    eveng_images_installed_paths: []
    eveng_images_installed_types: []
    eveng_images_manifest_updates: >-
      {{ eveng_images_install_manifest.images | default({}) }}
  changed_when: false

- name: Reuse verified installed images
  ansible.builtin.set_fact:
    eveng_images_installed_paths: >-
      {{ eveng_images_installed_paths + [item.item.installed_path] }}
    eveng_images_installed_types: >-
      {{
        eveng_images_installed_types
        + [
          item.item.detection.stdout
          | trim
          | regex_replace('^(structured:|raw:)', '')
        ]
      }}
  loop: "{{ eveng_images_reuse_checks.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - not (item.skipped | default(false))
    - item.stat.exists | default(false)
  changed_when: false

- name: Select images requiring installation
  ansible.builtin.set_fact:
    eveng_images_pending_installations: >-
      {{ eveng_images_pending_installations + [item.item] }}
  loop: "{{ eveng_images_reuse_checks.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: >-
    item.skipped | default(false)
    or not (item.stat.exists | default(false))
  changed_when: false

- name: Calculate new or changed image checksums
  ansible.builtin.stat:
    path: "{{ item.detection.item.path }}"
    checksum_algorithm: sha256
  loop: "{{ eveng_images_pending_installations }}"
  loop_control:
    label: "{{ item.key }}"
  register: eveng_images_pending_image_stats

- name: Initialise checksummed image installations
  ansible.builtin.set_fact:
    eveng_images_checksummed_installations: []
  changed_when: false

- name: Record new or changed image checksums
  ansible.builtin.set_fact:
    eveng_images_checksummed_installations: >-
      {{
        eveng_images_checksummed_installations
        + [item.item | combine({'sha256': item.stat.checksum})]
      }}
  loop: "{{ eveng_images_pending_image_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  changed_when: false

- name: Publish checksummed image installation plan
  ansible.builtin.set_fact:
    eveng_images_pending_installations: >-
      {{ eveng_images_checksummed_installations }}
  changed_when: false

- name: Install new or changed images
  ansible.builtin.include_tasks: install-one.yml
  loop: "{{ eveng_images_pending_installations }}"
  loop_control:
    loop_var: image_candidate
    label: "{{ image_candidate.key }}"
  vars:
    image_detection: "{{ image_candidate.detection }}"

- name: Install operator-supplied IOL licence material
  ansible.builtin.copy:
    dest: "{{ eveng_images_iol_license_path }}"
    content: >-
      {{
        eveng_images_iol_license_content
        | string
        | replace('\r\n', '\n')
        | replace('\r', '\n')
        | trim
      }}{{ '\n' }}
    owner: "{{ eveng_images_iol_license_owner }}"
    group: "{{ eveng_images_iol_license_group }}"
    mode: "0644"
  when: eveng_images_iol_license_content | string | length > 0
  no_log: true
  register: eveng_images_iol_license_install

- name: Repair EVE-NG image permissions
  ansible.builtin.command: "{{ eveng_images_fixpermissions_command }}"
  changed_when: true
  when: >-
    eveng_images_pending_installations | length > 0
    or eveng_images_iol_license_install.changed | default(false)

- name: Verify IOL licence placement
  ansible.builtin.stat:
    path: "{{ eveng_images_iol_license_path }}"
  register: eveng_images_iol_license_stat
  when: eveng_images_iol_license_content | string | length > 0

- name: Require installed IOL licence material
  ansible.builtin.assert:
    that:
      - eveng_images_iol_license_stat.stat.isreg | default(false)
      - eveng_images_iol_license_stat.stat.mode == '0644'
      - eveng_images_iol_license_stat.stat.pw_name == eveng_images_iol_license_owner
      - eveng_images_iol_license_stat.stat.gr_name == eveng_images_iol_license_group
      - eveng_images_iol_license_stat.stat.size | default(0) > 0
    fail_msg: "The operator-supplied IOL licence file was not installed."
  when: eveng_images_iol_license_content | string | length > 0

- name: Publish IOL licence readiness without exposing material
  ansible.builtin.set_fact:
    eveng_images_iol_license_ready: >-
      {{ eveng_images_iol_license_stat.stat.isreg | default(false) }}
  when: eveng_images_iol_license_content | string | length > 0

- name: Verify every image produced installed content
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ eveng_images_installed_paths | default([]) }}"
  register: eveng_images_installed_path_stats

- name: Fail when installed image content is missing
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "Installed image content is missing: {{ item.item }}"
  loop: "{{ eveng_images_installed_path_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

- name: Fail when no image content was installed
  ansible.builtin.assert:
    that:
      - >-
        (eveng_images_installed_paths | default([]) | length)
        == (eveng_images_detected_types.results | default([]) | length)
    fail_msg: >-
      Installed {{ eveng_images_installed_paths | default([]) | length }} of
      {{ eveng_images_detected_types.results | default([]) | length }} requested image archives.

- name: Discover installed IOL binaries
  ansible.builtin.find:
    paths: "{{ eveng_images_addons_dir }}/iol/bin"
    patterns: "*.bin"
    file_type: file
    recurse: false
  register: eveng_images_installed_iol_binaries
  when: "'iol' in (eveng_images_installed_types | default([]))"

- name: Require one installed IOL binary per requested archive
  ansible.builtin.assert:
    that:
      - >-
        (eveng_images_installed_iol_binaries.matched | default(0) | int)
        >= ((eveng_images_installed_types | default([]) | select('equalto', 'iol') | list) | length)
    fail_msg: >-
      IOL image installation did not produce the expected binaries in
      {{ eveng_images_addons_dir }}/iol/bin.
  when: "'iol' in (eveng_images_installed_types | default([]))"

- name: Check installed IOL binaries are executable
  ansible.builtin.shell: |
    set -euo pipefail
    find "$HYOPS_IOL_BIN_DIR" -maxdepth 1 -type f -name '*.bin' ! -perm /111 -print -quit
  args:
    executable: /bin/bash
  environment:
    HYOPS_IOL_BIN_DIR: "{{ eveng_images_addons_dir }}/iol/bin"
  register: eveng_images_non_executable_iol_binary
  changed_when: false
  when: "'iol' in (eveng_images_installed_types | default([]))"

- name: Require executable IOL binaries
  ansible.builtin.assert:
    that:
      - eveng_images_non_executable_iol_binary.stdout | trim | length == 0
    fail_msg: >-
      An installed IOL binary is not executable:
      {{ eveng_images_non_executable_iol_binary.stdout | trim }}.
  when: "'iol' in (eveng_images_installed_types | default([]))"

- name: Ensure image installation manifest directory exists
  ansible.builtin.file:
    path: "{{ eveng_images_install_manifest_path | dirname }}"
    state: directory
    owner: "{{ eveng_images_install_manifest_owner }}"
    group: "{{ eveng_images_install_manifest_group }}"
    mode: "0755"

- name: Write image installation manifest
  ansible.builtin.copy:
    dest: "{{ eveng_images_install_manifest_path }}"
    owner: "{{ eveng_images_install_manifest_owner }}"
    group: "{{ eveng_images_install_manifest_group }}"
    mode: "0644"
    content: >-
      {{
        {
          'schema_version': 1,
          'images': eveng_images_manifest_updates
        }
        | to_nice_json
      }}

- name: Publish verified image installation state
  ansible.builtin.set_fact:
    eveng_images_requested_count: >-
      {{ eveng_images_detected_types.results | default([]) | length }}
    eveng_images_installed_count: "{{ eveng_images_installed_paths | default([]) | length }}"
    eveng_images_install_ready: true
  changed_when: false
