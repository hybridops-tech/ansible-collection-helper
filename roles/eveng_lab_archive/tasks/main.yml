---
# purpose: Export or restore portable EVE-NG lab definitions
# maintainer: HybridOps.Tech

- name: Resolve EVE-NG lab archive path
  ansible.builtin.set_fact:
    _eveng_lab_archive_path: >-
      {{
        eveng_lab_archive_resolved_path
        if eveng_lab_archive_resolved_path | string | trim | length > 0
        else eveng_lab_archive_path
      }}
    _eveng_lab_archive_node_state_path: >-
      {{
        eveng_lab_archive_node_state_path
        if eveng_lab_archive_node_state_path | string | trim | length > 0
        else (
          (
            eveng_lab_archive_resolved_path
            if eveng_lab_archive_resolved_path | string | trim | length > 0
            else eveng_lab_archive_path
          )
          ~ '.node-state.tar.gz'
        )
      }}
    _eveng_lab_archive_images_path: "{{ eveng_lab_archive_images_path }}"

- name: Resolve EVE-NG archive generation paths
  ansible.builtin.set_fact:
    _eveng_lab_archive_candidate_path: "{{ _eveng_lab_archive_path }}.candidate"
    _eveng_lab_archive_previous_path: "{{ _eveng_lab_archive_path }}.previous"
    _eveng_lab_archive_node_state_candidate_path: >-
      {{ _eveng_lab_archive_node_state_path }}.candidate
    _eveng_lab_archive_node_state_previous_path: >-
      {{ _eveng_lab_archive_node_state_path }}.previous

- name: Validate EVE-NG lab archive settings
  ansible.builtin.assert:
    that:
      - eveng_lab_archive_action in ['export', 'restore']
      - _eveng_lab_archive_path | string | trim | length > 0
      - _eveng_lab_archive_path is match('^/')
      - eveng_lab_archive_folders is sequence
      - eveng_lab_archive_folders is not string
      - eveng_lab_archive_include_node_state is boolean
      - eveng_lab_archive_restore_node_state is boolean
      - eveng_lab_archive_stop_running_nodes is boolean
      - eveng_lab_archive_guest_quiesced is boolean
      - eveng_lab_archive_quiesce_script_path is string
      - eveng_lab_archive_quiesce_timeout_s | int >= 1
      - eveng_lab_archive_quiesce_timeout_s | int <= 3600
      - eveng_lab_archive_restore_images is boolean
      - eveng_lab_archive_overwrite_images is boolean
      - eveng_lab_archive_restore_free_reserve_bytes | int >= 0
      - eveng_lab_archive_capture_device_configs is boolean
      - eveng_lab_archive_config_export_timeout_s | int >= 1
      - eveng_lab_archive_config_export_timeout_s | int <= 3600
      - eveng_lab_archive_activate_saved_configs is boolean
      - eveng_lab_archive_api_validate_certs is boolean
      - eveng_lab_archive_node_state_root is match('^/')
      - _eveng_lab_archive_node_state_path is match('^/')
      - eveng_lab_archive_images_root is match('^/')
      - eveng_lab_archive_images_owner | string | trim | length > 0
      - eveng_lab_archive_images_group | string | trim | length > 0
      - eveng_lab_archive_fixpermissions_command | string | trim | length > 0
      - eveng_lab_archive_wrapper_command is match('^/')
      - >-
        not eveng_lab_archive_restore_images
        or _eveng_lab_archive_images_path is match('^/')
      - eveng_lab_archive_tenant_uid_base | int >= 0
      - eveng_lab_archive_tenant_gid | string is match('^[0-9]+$')
      - eveng_lab_archive_api_base_url is match('^https?://')
      - eveng_lab_archive_api_username | string | trim | length > 0
      - eveng_lab_archive_api_password_env | string | trim | length > 0
      - eveng_lab_archive_iou_export is match('^/')
    fail_msg: "EVE-NG lab archive settings are invalid"

- name: Require one EVE-NG guest quiescence method
  ansible.builtin.assert:
    that:
      - >-
        (eveng_lab_archive_guest_quiesced | bool)
        !=
        (eveng_lab_archive_quiesce_script_path | trim | length > 0)
    fail_msg: >-
      EVE-NG node-state export requires exactly one quiescence method: set
      eveng_lab_archive_guest_quiesced or provide
      eveng_lab_archive_quiesce_script_path.
  when:
    - eveng_lab_archive_action == 'export'
    - eveng_lab_archive_include_node_state | bool

- name: Restrict saved-configuration capture to export
  ansible.builtin.assert:
    that:
      - eveng_lab_archive_action == 'export'
    fail_msg: >-
      eveng_lab_archive_capture_device_configs is valid only for export
  when: eveng_lab_archive_capture_device_configs | bool

- name: Require a complete lab export with node state
  ansible.builtin.assert:
    that:
      - eveng_lab_archive_folders | length == 0
    fail_msg: >-
      Node-state capture requires a complete lab export. Leave
      eveng_lab_archive_folders empty.
  when:
    - eveng_lab_archive_action == 'export'
    - eveng_lab_archive_include_node_state | bool

- name: Validate node-state restore checksum
  ansible.builtin.assert:
    that:
      - eveng_lab_archive_node_state_expected_sha256 is match('^[0-9a-fA-F]{64}$')
    fail_msg: >-
      eveng_lab_archive_node_state_expected_sha256 must contain 64 hexadecimal
      characters
  when:
    - eveng_lab_archive_action == 'restore'
    - eveng_lab_archive_restore_node_state | bool

- name: Validate image restore checksum
  ansible.builtin.assert:
    that:
      - eveng_lab_archive_images_expected_sha256 is match('^[0-9a-fA-F]{64}$')
    fail_msg: >-
      eveng_lab_archive_images_expected_sha256 must contain 64 hexadecimal
      characters
  when:
    - eveng_lab_archive_action == 'restore'
    - eveng_lab_archive_restore_images | bool

- name: Validate selected EVE-NG lab folders
  ansible.builtin.assert:
    that:
      - item is string
      - item | string | trim | length > 0
      - item is not match('^/')
      - item is not search('(^|/)\.\.(/|$)')
    fail_msg: "EVE-NG lab archive folders must be safe relative paths"
  loop: "{{ eveng_lab_archive_folders }}"

- name: Capture saved EVE-NG device configurations
  ansible.builtin.include_tasks: capture-device-configs.yml
  when:
    - eveng_lab_archive_action == 'export'
    - eveng_lab_archive_capture_device_configs | bool

- name: Quiesce EVE-NG guests
  ansible.builtin.include_tasks: quiesce.yml
  when:
    - eveng_lab_archive_action == 'export'
    - eveng_lab_archive_include_node_state | bool

- name: Initialise saved-configuration result
  ansible.builtin.set_fact:
    eveng_lab_archive_device_config_results:
      captured: false
      labs: []
  when: not eveng_lab_archive_capture_device_configs | bool

- name: Export EVE-NG labs
  ansible.builtin.include_tasks: export.yml
  when: eveng_lab_archive_action == 'export'

- name: Export stopped EVE-NG node state
  ansible.builtin.include_tasks: export-node-state.yml
  when:
    - eveng_lab_archive_action == 'export'
    - eveng_lab_archive_include_node_state | bool

- name: Promote verified EVE-NG archive
  ansible.builtin.include_tasks: promote.yml
  when: eveng_lab_archive_action == 'export'

- name: Restore referenced EVE-NG base images
  ansible.builtin.include_tasks: restore-images.yml
  when:
    - eveng_lab_archive_action == 'restore'
    - eveng_lab_archive_restore_images | bool

- name: Restore EVE-NG labs
  ansible.builtin.include_tasks: restore.yml
  when: eveng_lab_archive_action == 'restore'

- name: Activate restored EVE-NG saved configurations
  ansible.builtin.include_tasks: activate-restored-configs.yml
  when:
    - eveng_lab_archive_action == 'restore'
    - eveng_lab_archive_activate_saved_configs | bool

- name: Restore stopped EVE-NG node state
  ansible.builtin.include_tasks: restore-node-state.yml
  when:
    - eveng_lab_archive_action == 'restore'
    - eveng_lab_archive_restore_node_state | bool

- name: Publish EVE-NG image restore result
  ansible.builtin.set_fact:
    eveng_lab_archive_results: >-
      {{
        eveng_lab_archive_results
        | combine({
          'images_included': true,
          'images_restored': true,
          'images_archive_path': _eveng_lab_archive_images_path,
          'images_sha256':
            eveng_lab_archive_images_controller_stat.stat.checksum
        })
      }}
  when:
    - eveng_lab_archive_action == 'restore'
    - eveng_lab_archive_restore_images | bool
