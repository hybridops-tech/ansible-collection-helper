---
- name: Inspect EVE-NG node-state root
  ansible.builtin.stat:
    path: "{{ eveng_lab_archive_node_state_root }}"
  register: eveng_lab_archive_node_state_root_stat

- name: Prepare remote node-state archive directory
  ansible.builtin.file:
    path: "{{ eveng_lab_archive_remote_dir }}"
    state: directory
    mode: "0700"

- name: Require EVE-NG node-state root
  ansible.builtin.assert:
    that:
      - eveng_lab_archive_node_state_root_stat.stat.isdir | default(false)
    fail_msg: >-
      EVE-NG node-state root does not exist:
      {{ eveng_lab_archive_node_state_root }}

- name: Prepare node-state capture metadata directory
  ansible.builtin.file:
    path: "{{ eveng_lab_archive_remote_dir }}/hybridops"
    state: directory
    mode: "0700"

- name: Write node-state capture metadata
  ansible.builtin.copy:
    dest: "{{ eveng_lab_archive_remote_dir }}/hybridops/capture.json"
    mode: "0600"
    content: >-
      {{ {
        'schema': 'hybridops.eve-node-state-capture/v1',
        'quiescence': {
          'method': eveng_lab_archive_quiescence_evidence.method,
          'qemu_processes_absent': true,
          'iol_processes_absent': true,
          'script_sha256':
            eveng_lab_archive_quiescence_evidence.script_sha256
        }
      } | to_nice_json }}

- name: Select available qemu-img command
  ansible.builtin.shell: |
    set -eu
    if [ -x {{ eveng_lab_archive_qemu_img | quote }} ]; then
      printf '%s\n' {{ eveng_lab_archive_qemu_img | quote }}
    else
      command -v qemu-img
    fi
  args:
    executable: /bin/bash
  changed_when: false
  register: eveng_lab_archive_qemu_img_command

- name: Check for running EVE-NG QEMU nodes
  ansible.builtin.shell: |
    set -o pipefail
    pgrep -af '[/]opt/qemu[^ ]*/bin/qemu-system-' || true
  args:
    executable: /bin/bash
  changed_when: false
  register: eveng_lab_archive_running_qemu

- name: Require stopped QEMU nodes
  ansible.builtin.assert:
    that:
      - eveng_lab_archive_running_qemu.stdout | trim | length == 0
    fail_msg: >-
      QEMU nodes are running. Shut down stateful guests inside the guest, stop
      the remaining EVE-NG nodes, and retry the export.

- name: Check for running EVE-NG IOL nodes
  ansible.builtin.shell: |
    set -o pipefail
    pgrep -af '[/]opt/unetlab/addons/iol/bin/' || true
  args:
    executable: /bin/bash
  changed_when: false
  register: eveng_lab_archive_running_iol

- name: Require stopped IOL nodes
  ansible.builtin.assert:
    that:
      - eveng_lab_archive_running_iol.stdout | trim | length == 0
    fail_msg: >-
      IOL nodes are running. Save their configurations, stop the EVE-NG nodes,
      and retry the export.

- name: Find EVE-NG QEMU overlays
  ansible.builtin.find:
    paths: "{{ eveng_lab_archive_node_state_root }}"
    patterns: "*.qcow2"
    file_type: file
    recurse: true
    follow: false
  register: eveng_lab_archive_node_state_files

- name: Select writable EVE-NG QEMU overlays
  ansible.builtin.set_fact:
    eveng_lab_archive_node_state_overlays: >-
      {{
        eveng_lab_archive_node_state_files.files
        | rejectattr('path', 'search', '/opt/unetlab/addons/qemu/')
        | list
      }}

- name: Find EVE-NG IOL state files
  ansible.builtin.find:
    paths: "{{ eveng_lab_archive_node_state_root }}"
    patterns:
      - "nvram_*"
      - "vlan.dat-*"
    file_type: file
    recurse: true
    follow: false
  register: eveng_lab_archive_iol_state_files

- name: Select EVE-NG IOL state
  ansible.builtin.set_fact:
    eveng_lab_archive_node_state_iol_files: >-
      {{
        eveng_lab_archive_iol_state_files.files
        | map(attribute='path')
        | map('regex_replace', '^' ~ (eveng_lab_archive_node_state_root | regex_escape) ~ '/', '')
        | select('match', '^[0-9]+/[^/]+/[0-9]+/(nvram_[0-9]+|vlan\.dat-[0-9]+)$')
        | list
      }}
    eveng_lab_archive_node_state_overlay_files: >-
      {{
        eveng_lab_archive_node_state_overlays
        | map(attribute='path')
        | map('regex_replace', '^' ~ (eveng_lab_archive_node_state_root | regex_escape) ~ '/', '')
        | list
      }}

- name: Validate EVE-NG node-state paths
  ansible.builtin.assert:
    that:
      - >-
        eveng_lab_archive_node_state_overlay_files
        | reject('match', '^[0-9]+/[^/]+/[0-9]+/[^/]+\.qcow2$')
        | list | length == 0
      - >-
        eveng_lab_archive_iol_state_files.files | length
        == eveng_lab_archive_node_state_iol_files | length
    fail_msg: "EVE-NG node state contains an unsupported path"

- name: Combine EVE-NG node-state files
  ansible.builtin.set_fact:
    eveng_lab_archive_node_state_selected_files: >-
      {{
        (eveng_lab_archive_node_state_overlay_files
        + eveng_lab_archive_node_state_iol_files) | sort
      }}

- name: Validate EVE-NG QEMU overlays
  ansible.builtin.command:
    argv:
      - "{{ eveng_lab_archive_qemu_img_command.stdout | trim }}"
      - check
      - -q
      - "{{ item.path }}"
  loop: "{{ eveng_lab_archive_node_state_overlays }}"
  loop_control:
    label: "{{ item.path }}"
  changed_when: false

- name: Write node-state member list
  ansible.builtin.copy:
    dest: "{{ eveng_lab_archive_remote_dir }}/node-state-members.txt"
    mode: "0600"
    content: |
      {% for item in eveng_lab_archive_node_state_selected_files %}
      {{ item }}
      {% endfor %}
  when: eveng_lab_archive_node_state_selected_files | length > 0

- name: Build EVE-NG node-state archive
  ansible.builtin.command:
    argv:
      - tar
      - --sort=name
      - --mtime=@0
      - --owner=0
      - --group=0
      - --numeric-owner
      - -czf
      - "{{ eveng_lab_archive_remote_dir }}/node-state.tar.gz"
      - -C
      - "{{ eveng_lab_archive_node_state_root }}"
      - -T
      - "{{ eveng_lab_archive_remote_dir }}/node-state-members.txt"
      - -C
      - "{{ eveng_lab_archive_remote_dir }}"
      - hybridops/capture.json
  changed_when: true
  when: eveng_lab_archive_node_state_selected_files | length > 0

- name: Fetch EVE-NG node-state archive
  ansible.builtin.fetch:
    src: "{{ eveng_lab_archive_remote_dir }}/node-state.tar.gz"
    dest: "{{ _eveng_lab_archive_node_state_candidate_path }}"
    flat: true
  when: eveng_lab_archive_node_state_selected_files | length > 0

- name: Remove stale candidate node-state archive
  ansible.builtin.file:
    path: "{{ _eveng_lab_archive_node_state_candidate_path }}"
    state: absent
  delegate_to: localhost
  become: false
  when: eveng_lab_archive_node_state_selected_files | length == 0

- name: Protect candidate controller node-state archive
  ansible.builtin.file:
    path: "{{ _eveng_lab_archive_node_state_candidate_path }}"
    state: file
    mode: "0600"
  delegate_to: localhost
  become: false
  when: eveng_lab_archive_node_state_selected_files | length > 0

- name: Verify fetched EVE-NG node-state archive structure
  ansible.builtin.command:
    argv:
      - tar
      - -tzf
      - "{{ _eveng_lab_archive_node_state_candidate_path }}"
  delegate_to: localhost
  become: false
  changed_when: false
  register: eveng_lab_archive_node_state_controller_members
  when: eveng_lab_archive_node_state_selected_files | length > 0

- name: Require every selected file in fetched node-state archive
  ansible.builtin.assert:
    that:
      - >-
        eveng_lab_archive_node_state_controller_members.stdout_lines | sort
        == ((
          eveng_lab_archive_node_state_selected_files
          + ['hybridops/capture.json']
        ) | sort)
    fail_msg: "Fetched EVE-NG node-state archive does not match the selected files"
  delegate_to: localhost
  become: false
  when: eveng_lab_archive_node_state_selected_files | length > 0

- name: Calculate node-state archive checksum
  ansible.builtin.stat:
    path: "{{ _eveng_lab_archive_node_state_candidate_path }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: eveng_lab_archive_node_state_controller_stat
  when: eveng_lab_archive_node_state_selected_files | length > 0

- name: Publish EVE-NG node-state archive result
  ansible.builtin.set_fact:
    eveng_lab_archive_results: >-
      {{
        eveng_lab_archive_results
        | combine({
          'node_state_included': eveng_lab_archive_node_state_selected_files | length > 0,
          'node_state_archive_path': (
            _eveng_lab_archive_node_state_path
            if eveng_lab_archive_node_state_selected_files | length > 0
            else ''
          ),
          'node_state_sha256': (
            eveng_lab_archive_node_state_controller_stat.stat.checksum
            if eveng_lab_archive_node_state_selected_files | length > 0
            else ''
          ),
          'node_state_files': eveng_lab_archive_node_state_selected_files | length,
          'quiescence_method': eveng_lab_archive_quiescence_evidence.method,
          'quiescence_script_sha256':
            eveng_lab_archive_quiescence_evidence.script_sha256,
          'quiescence_verified_at':
            eveng_lab_archive_quiescence_evidence.verified_at
        })
      }}

- name: Update candidate controller archive manifest with node state
  ansible.builtin.copy:
    dest: "{{ _eveng_lab_archive_candidate_path }}.json"
    mode: "0600"
    content: >-
      {{ {
        'schema_version': 2,
        'kind': 'hybridops/eveng-lab-archive',
        'archive_file': _eveng_lab_archive_path | basename,
        'sha256': eveng_lab_archive_results.sha256,
        'created_at': eveng_lab_archive_results.created_at,
        'folders': eveng_lab_archive_results.folders,
        'device_configs': {
          'captured': eveng_lab_archive_results.device_configs_captured,
          'labs': eveng_lab_archive_results.device_config_labs
        },
        'node_state': {
          'included': eveng_lab_archive_results.node_state_included,
          'archive_file':
            eveng_lab_archive_results.node_state_archive_path | basename,
          'sha256': eveng_lab_archive_results.node_state_sha256,
          'files': eveng_lab_archive_results.node_state_files,
          'members': (
            eveng_lab_archive_node_state_controller_members.stdout_lines
            if eveng_lab_archive_results.node_state_included
            else []
          ),
          'quiescence': eveng_lab_archive_quiescence_evidence
        }
      } | to_nice_json }}
  delegate_to: localhost
  become: false

- name: Remove remote node-state archive staging
  ansible.builtin.file:
    path: "{{ eveng_lab_archive_remote_dir }}"
    state: absent
